</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;height:calc(var(--vh,1vh)*100);}
body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#e0e0e0;overflow:hidden;display:flex;flex-direction:column;
  background-image:radial-gradient(circle at 82% -12%,#1f1a10 0%,#111 55%);}
button{font-family:inherit;}

/* ===== top bars ===== */
#bar1{display:flex;align-items:center;gap:4px;padding:7px 10px;border-bottom:1px solid #1f1f2e;background:#0e0e15;flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
#bar2{display:flex;align-items:center;gap:6px;padding:5px 10px;border-bottom:1px solid #1f1f2e;background:#0c0c12;flex-shrink:0;overflow-x:auto;scrollbar-width:none;min-height:42px;}
#bar1::-webkit-scrollbar,#bar2::-webkit-scrollbar{display:none;}
#brand{display:flex;align-items:center;gap:8px;margin-right:6px;flex-shrink:0;}
#brand .mark{width:24px;height:24px;border-radius:7px;background:#10131f;border:1px solid #5a4a2b;display:flex;align-items:center;justify-content:center;}
#brand .name{font-weight:700;font-size:14px;color:#ede6d8;white-space:nowrap;}
#brand .name b{color:#f59e0b;}
.mbtn{width:32px;height:32px;border-radius:8px;border:1px solid #23232f;background:#13131c;color:#bcbcd0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.1s;}
.mbtn:hover{background:#1c1c28;color:#e0e0e0;}
.mbtn.on{background:#241c0d;border-color:#5a4a2b;color:#fbbf24;}
.mbtn:disabled{opacity:.32;cursor:default;}
.mbtn svg{display:block;pointer-events:none;}
.bsep{width:1px;height:22px;background:#23232f;margin:0 4px;flex-shrink:0;}
#spacer-r{margin-left:auto;}
#now{height:32px;padding:0 11px;border-radius:8px;border:1px solid #23232f;background:#13131c;color:#bcbcd0;font-size:11.5px;cursor:pointer;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:6px;}
#now:hover{border-color:#5a4a2b;color:#fbbf24;}
/* ink controls */
#inkbar{display:none;align-items:center;gap:6px;}
#swatches{display:flex;gap:5px;flex-shrink:0;}
.sw{width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.18);cursor:pointer;flex-shrink:0;padding:0;transition:transform .08s;}
.sw:hover{transform:scale(1.12);}
.sw.on{outline:2px solid #fbbf24;outline-offset:1px;}
#custom{width:30px;height:30px;border-radius:7px;border:1px solid #2a2a3a;background:#13131c;padding:2px;cursor:pointer;flex-shrink:0;}
#sizewrap{display:flex;align-items:center;gap:6px;flex-shrink:0;padding:0 2px;}
#size{width:90px;accent-color:#f59e0b;cursor:pointer;}
#sizeval{font-size:11px;color:#8d8da4;font-family:monospace;min-width:34px;text-align:right;}
#handmsg{display:none;font-size:11.5px;color:#56566e;padding:0 4px;}

/* ===== stage / layers ===== */
#stage{flex:1;min-height:0;position:relative;}
#wrap{position:absolute;inset:0;overflow-y:scroll;overflow-x:hidden;touch-action:pan-y;z-index:1;}
#wrap::-webkit-scrollbar{width:10px;}
#wrap::-webkit-scrollbar-thumb{background:#2a2330;border-radius:6px;border:2px solid #0e0e15;}
#wrap::-webkit-scrollbar-track{background:transparent;}
#pad{position:relative;min-height:100%;}
#ink{position:absolute;inset:0;display:block;z-index:5;pointer-events:none;touch-action:none;}

/* ===== rich text editor (module) ===== */
.toolbar{display:flex;align-items:center;gap:3px;flex-wrap:nowrap;}
.tbtn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:5px;color:#bbb;border:none;background:transparent;font-size:12px;font-weight:500;flex-shrink:0;user-select:none;transition:background .1s;}
.tbtn:hover{background:#23232f;}.tbtn.on{background:#1e3a5f;color:#60a5fa;}
.tsep{width:1px;height:16px;background:#2a2a3a;margin:0 1px;flex-shrink:0;}
.toolbar select,.toolbar input[type="number"]{height:24px;font-size:11px;padding:0 3px;border:1px solid #2a2a3a;border-radius:5px;background:#111;color:#bbb;}
.toolbar select{max-width:120px;}
.toolbar input[type="number"]{width:40px;text-align:center;}
.color-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:26px;height:26px;border-radius:5px;cursor:pointer;user-select:none;flex-shrink:0;transition:background .1s;}
.color-btn:hover{background:#23232f;}
.color-btn.on{background:#1e3a5f;}
.color-btn .cletter{font-size:12px;font-weight:600;line-height:1;color:#bbb;}
.color-btn .cbar{height:3px;width:16px;border-radius:2px;margin-top:2px;transition:background .15s;}
.color-pop{position:fixed;z-index:10000;background:#1c1c28;border:1px solid #3a3a4a;border-radius:10px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.5);width:196px;display:none;}
.color-pop.open{display:block;}
.color-pop .cp-row{display:flex;align-items:center;gap:7px;width:100%;background:transparent;border:none;color:#c0c0d8;font-size:12px;font-family:inherit;cursor:pointer;padding:6px;border-radius:6px;text-align:left;}
.color-pop .cp-row:hover{background:#262635;}
.color-pop .cp-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5a5a72;margin:9px 2px 5px;}
.color-pop .cp-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;}
.color-pop .cp-fav-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;}
.color-pop .cp-sw{width:100%;aspect-ratio:1;border-radius:4px;border:1px solid rgba(255,255,255,.12);cursor:pointer;position:relative;transition:transform .08s,border-color .1s;padding:0;}
.color-pop .cp-sw:hover{transform:scale(1.14);border-color:rgba(255,255,255,.45);z-index:1;}
.color-pop .cp-fav{width:100%;aspect-ratio:1;border-radius:5px;border:1px solid rgba(255,255,255,.18);cursor:pointer;position:relative;transition:transform .08s;padding:0;}
.color-pop .cp-fav:hover{transform:scale(1.1);}
.color-pop .cp-fav .cp-x{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:#2a2a3a;border:1px solid #4a4a5a;color:#ddd;font-size:10px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;}
.color-pop .cp-fav:hover .cp-x{display:flex;}
.color-pop .cp-fav-add{width:100%;aspect-ratio:1;border-radius:5px;border:1px dashed #4a4a5a;background:transparent;color:#7a7a92;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;padding:0;}
.color-pop .cp-fav-add:hover{border-color:#60a5fa;color:#60a5fa;}
.color-pop .cp-divider{height:1px;background:#2a2a38;margin:9px 0;}
.color-pop .cp-current{position:relative;}
.color-pop .cp-current .cp-cur-sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(255,255,255,.25);flex-shrink:0;}
.color-pop .cp-current span:nth-child(2){flex:1;}
.color-pop .cp-current .cp-cur-hex{font-family:monospace;font-size:10px;color:#7a7a92;}
.color-pop .cp-star{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:#2a2a3a;border:1px solid #4a4a5a;color:#fbbf24;font-size:8px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;}
.color-pop .cp-fav:hover .cp-star{display:flex;}
.img-resize-group{display:none;align-items:center;gap:5px;border:1px solid #3a5a3a;border-radius:7px;padding:2px 6px;height:26px;background:#161e16;}
.img-resize-group.visible{display:flex;}
.img-resize-group .resize-label{font-size:10px;color:#7dba7d;white-space:nowrap;user-select:none;}
.img-resize-group input[type="range"]{width:64px;height:4px;accent-color:#4caf50;cursor:pointer;}
.img-resize-group .resize-val{font-size:10px;color:#7dba7d;min-width:30px;text-align:right;font-family:monospace;}
/* infinite, top-aligned flow (valign neutralised for a scrolling page) */
.editor-valign-wrap{position:static;display:block;overflow:visible;}
.editor{outline:none;font-size:15px;line-height:1.75;color:#e0e0e0;cursor:text;caret-color:#e0e0e0;padding:18px 20px 45vh 70px;min-height:60vh;}
.editor .line{min-height:1.75em;white-space:pre-wrap;word-break:break-word;}
.img-run{display:inline-block;vertical-align:middle;position:relative;}
.img-run.img-selected img{outline:2px solid #4caf50;border-radius:2px;}
.status{display:none;}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(18px);background:#13131e;border:1px solid #2a2a3a;color:#c0c0e0;font-size:12px;padding:8px 16px;border-radius:9px;box-shadow:0 4px 20px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.2s;z-index:11000;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.ok{border-color:#22543d;color:#4ade80;}#toast.err{border-color:#7f1d1d;color:#f87171;}#toast.info{border-color:#1e3a5f;color:#60a5fa;}
#hint{position:absolute;left:50%;top:34%;transform:translateX(-50%);text-align:center;color:#4a4a60;font-size:14px;line-height:2;pointer-events:none;user-select:none;z-index:6;}
#hint b{color:#6a5a35;}
@media (max-width:560px){#brand .name{display:none;}#size{width:66px;}.editor{padding-left:54px;}}

/* ===== marks / panels (riffrolled-style) ===== */
:root{--accent:#818cf8;--accent2:#6366f1;--panel:#15151f;--pborder:#2a2a3a;--pmut:#8a8aa4;}
#gut{position:absolute;left:0;top:0;bottom:0;z-index:6;width:70px;}
#gut-grip{position:absolute;top:0;bottom:0;right:0;width:8px;cursor:col-resize;}
#gut-grip:hover{background:linear-gradient(90deg,transparent,rgba(129,140,248,.3));}
#gut-add{position:absolute;left:50%;transform:translateX(-50%);top:8px;width:24px;height:24px;border-radius:50%;border:1px solid #5a4a2b;background:#1a1510;color:#fbbf24;font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#gut-add:hover{background:#241c0d;}
.panel{position:fixed;z-index:9000;background:var(--panel);border:1px solid var(--pborder);border-radius:13px;box-shadow:0 24px 70px rgba(0,0,0,.6);color:#e6e6f0;width:330px;max-width:94vw;display:flex;flex-direction:column;overflow:hidden;}
.panel-h{display:flex;align-items:center;gap:9px;padding:11px 12px;border-bottom:1px solid #20202e;cursor:grab;user-select:none;}
.panel-h.drag{cursor:grabbing;}
.panel-ic{width:26px;height:26px;border-radius:8px;background:#1d1d2b;border:1px solid var(--pborder);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.panel-t{font-weight:700;font-size:13.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.panel-x{width:26px;height:26px;border-radius:7px;border:1px solid var(--pborder);background:#16161f;color:#9090a8;font-size:15px;cursor:pointer;flex-shrink:0;}
.panel-x:hover{color:#f87171;border-color:#5a2b2b;}
.panel-b{padding:12px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;max-height:62vh;}
.pf{display:flex;flex-direction:column;gap:5px;}
.pf-l{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pmut);}
.pf-in{height:32px;background:#0f0f18;border:1px solid #26263a;border-radius:8px;color:#e6e6f0;font-size:13px;padding:0 11px;outline:none;font-family:inherit;}
.pf-in:focus{border-color:var(--accent);}
.seg{display:flex;gap:5px;}
.seg button{flex:1;height:30px;border-radius:8px;border:1px solid #26263a;background:#0f0f18;color:#9898b4;font-size:11.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
.seg button.on{border-color:var(--accent);color:#fff;background:#22223a;}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:#22223a;border:1px solid #34345a;color:#c4cafc;font-size:11px;}
.chip b{cursor:pointer;color:#7a7ab0;font-weight:400;}.chip b:hover{color:#f87171;}
.chip.link{cursor:pointer;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chip.link:hover{border-color:var(--accent);}

</style>

<script>
"use strict";
/* ===== Patchwork: one endless page \u2014 rich text + free-hand ink, time-stamped ===== */
function _setVH(){const h=(window.visualViewport?window.visualViewport.height:window.innerHeight)*0.01;document.documentElement.style.setProperty('--vh',h+'px');}
_setVH();window.addEventListener('resize',_setVH);window.addEventListener('orientationchange',_setVH);

const MAX_CARD_FIELD=12*1024*1024;
function toast(msg,type,action){const t=document.getElementById('toast');t.innerHTML='';const sp=document.createElement('span');sp.textContent=msg;t.appendChild(sp);if(action&&action.fn){const b=document.createElement('button');b.textContent=action.label||'Undo';b.style.cssText='margin-left:12px;background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 10px;font-size:11px;cursor:pointer;font-family:inherit;';b.onclick=()=>{t.className='';clearTimeout(t._t);try{action.fn();}catch(e){console.error(e);}};t.appendChild(b);}t.className='show '+(type||'info');clearTimeout(t._t);t._t=setTimeout(()=>{t.className='';},action?6500:2600);}

/* ---------- editor module (rich text \u2014 from In a Flash) ---------- */
const DEFAULT_TEXT_COLOR="#e0e0e0";
let COLOR_FAVORITES=[],COLOR_RECENTS=[];

async function DB_loadColors(){try{const i=await db.info.get('info');COLOR_FAVORITES=Array.isArray(i&&i.colorFavorites)?i.colorFavorites:[];COLOR_RECENTS=Array.isArray(i&&i.colorRecents)?i.colorRecents:[];}catch(e){}}
async function DB_saveColors(){try{await db.info.update('info',{colorFavorites:COLOR_FAVORITES,colorRecents:COLOR_RECENTS});}catch(e){}}
function normalizeHex(v){if(!v)return null;v=String(v).trim().toLowerCase();if(/^[0-9a-f]{6}$/.test(v))v="#"+v;if(/^[0-9a-f]{3}$/.test(v))v="#"+v[0]+v[0]+v[1]+v[1]+v[2]+v[2];return /^#[0-9a-f]{6}$/.test(v)?v:null;}
function pushRecentColor(hex){hex=normalizeHex(hex);if(!hex)return;COLOR_RECENTS=[hex,...COLOR_RECENTS.filter(c=>c!==hex)].slice(0,8);DB_saveColors();}
function addFavoriteColor(hex){hex=normalizeHex(hex);if(!hex)return false;if(COLOR_FAVORITES.includes(hex))return false;COLOR_FAVORITES=[...COLOR_FAVORITES,hex].slice(0,18);DB_saveColors();return true;}
function removeFavoriteColor(hex){COLOR_FAVORITES=COLOR_FAVORITES.filter(c=>c!==hex);DB_saveColors();}

let _draw=null;
function openDrawModal(onInsert){const st=_ensureDrawModal();st.onInsert=onInsert;st.strokes=[];st.active=null;st.drawing=false;st.tool="pen";st.bg="paper";st.canvas.className="bg-paper";_drawBuildSwatches();_drawUpdateUI();st.modal.style.display="flex";st.modal.focus();requestAnimationFrame(()=>{_drawResize();_drawRedraw();});}
function _ensureDrawModal(){
  if(_draw)return _draw;
  const css=document.createElement("style");
  css.textContent=`.draw-modal{position:fixed;inset:0;z-index:10500;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;}.draw-dialog{width:min(900px,95vw);height:min(660px,93vh);background:#161616;border:1px solid #2a2a2a;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55);}.draw-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #2a2a2a;flex-wrap:wrap;}.draw-head .dh-title{font-size:13px;color:#c0c0d8;font-weight:600;margin-right:2px;}.draw-tool{width:30px;height:30px;border-radius:7px;border:1px solid #2a2a2a;background:#1e1e1e;color:#bbb;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}.draw-tool:hover{background:#2a2a2a;}.draw-tool.on{background:#1e3a5f;border-color:#2b5a8f;color:#60a5fa;}.draw-sep{width:1px;height:22px;background:#2a2a2a;flex-shrink:0;}.draw-size{display:flex;align-items:center;gap:6px;color:#888;font-size:11px;}.draw-size input[type=range]{width:84px;}.draw-size .sz-val{min-width:18px;text-align:right;color:#aaa;}.draw-colors{display:flex;align-items:center;gap:4px;flex-wrap:wrap;max-width:300px;}.draw-sw{width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,.22);cursor:pointer;}.draw-sw.on{outline:2px solid #fff;outline-offset:1px;}.draw-pick{width:26px;height:26px;border:1px solid #3a3a4a;border-radius:5px;background:#111;cursor:pointer;padding:1px;}.draw-actions{margin-left:auto;display:flex;gap:8px;}.draw-btn{height:30px;padding:0 14px;border-radius:7px;border:1px solid #2a2a2a;background:#1e1e1e;color:#c0c0d8;font-size:12px;cursor:pointer;}.draw-btn:hover{background:#2a2a2a;}.draw-btn.primary{background:#2563eb;border-color:#2563eb;color:#fff;}.draw-btn.primary:hover{background:#1d4ed8;}.draw-btn:disabled{opacity:.4;cursor:not-allowed;}.draw-surface{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:12px;background:#0d0d0d;}#draw-canvas{border-radius:8px;box-shadow:0 0 0 1px #2a2a2a;touch-action:none;cursor:crosshair;}#draw-canvas.bg-paper{background:#fcfcf7;}#draw-canvas.bg-transparent{background-color:#2a2a2a;background-image:linear-gradient(45deg,#222 25%,transparent 25%),linear-gradient(-45deg,#222 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#222 75%),linear-gradient(-45deg,transparent 75%,#222 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0;}`;

async function addMark(obj,open){const m=Object.assign({pid,type:'note',name:'',tags:[],created:Date.now(),done:false,doneAt:null,links:[],anchor:{kind:'time',yn:0}},obj);try{const id=await db.marks.add(stripId(m));m.id=id;}catch(e){console.error(e);return null;}marks.push(m);lastActivityT=Math.max(lastActivityT,m.created);redrawInk();flashPin(m.id);if(open)openMarkPopup(m);return m;}
let _saveTimers={};
function saveMark(m){clearTimeout(_saveTimers[m.id]);_saveTimers[m.id]=setTimeout(()=>{db.marks.update(m.id,{type:m.type,name:m.name,tags:m.tags,done:m.done,doneAt:m.doneAt,links:m.links,anchor:m.anchor,snippet:m.snippet||'',created:m.created}).catch(e=>console.error(e));},300);}
async function hardDeleteMark(m){await db.marks.delete(m.id);if(m.anchor&&m.anchor.kind==='text'&&editor)editor.clearMarkRuns(m.id);for(const q of marks)if(q.links&&q.links.includes(m.id)){q.links=q.links.filter(x=>x!==m.id);saveMark(q);}marks=marks.filter(x=>x!==m);redrawInk();}
let _mkCleanT=null,_mkCleanId=null;
function softDeleteMark(m){const isText=m.anchor&&m.anchor.kind==='text';const qedits=[];for(const q of marks)if(q!==m&&q.links&&q.links.includes(m.id)){qedits.push(q);q.links=q.links.filter(x=>x!==m.id);saveMark(q);}const snap=JSON.parse(JSON.stringify(m));db.marks.delete(m.id).catch(()=>{});marks=marks.filter(x=>x!==m);if(isText&&editor)editor.refresh();redrawInk();if(isText){clearTimeout(_mkCleanT);_mkCleanId=m.id;_mkCleanT=setTimeout(()=>{if(editor&&_mkCleanId!=null)editor.clearMarkRuns(_mkCleanId);_mkCleanId=null;},6400);}toast('Deleted','ok',{label:'Undo',fn:()=>{if(isText){clearTimeout(_mkCleanT);_mkCleanId=null;}db.marks.put(snap).catch(()=>{});marks.push(snap);for(const q of qedits)if(!q.links.includes(snap.id)){q.links.push(snap.id);saveMark(q);}if(isText&&editor)editor.refresh();redrawInk();}});}

/* projects core */
function _quotaToast(e){if(e&&(e.name==='QuotaExceededError'||/quota/i.test((e.name||'')+(e.message||'')))){toast('Storage is full — back up, then remove some images so saving can continue','err');}else if(e){console.error(e);}}
async function savePageNow(){if(!editor||pid==null)return;try{await db.pages.put({pid,html:editor.getHTML(),scrollYn:scrollTop()/drawW,gutterW});}catch(e){_quotaToast(e);}}
function saveMeta(){clearTimeout(_metaTimer);_metaTimer=setTimeout(async()=>{try{if(editor&&pid!=null)await db.pages.put({pid,html:editor.getHTML(),scrollYn:scrollTop()/drawW,gutterW});await db.meta.put({id:'meta',activePid:pid});}catch(e){_quotaToast(e);}},500);}

let _lastHTML=null;
function checkText(){if(!editor)return;const html=editor.getHTML();if(html!==_lastHTML){const first=_lastHTML===null;_lastHTML=html;updatePad();if(!first)noteActivity(caretWorldYn());saveMeta();}}
function caretWorldYn(){try{const s=window.getSelection();if(s&&s.rangeCount){let r=s.getRangeAt(0).getClientRects()[0];if(!r){const n=s.anchorNode,el=n&&(n.nodeType===1?n:n.parentNode);if(el&&el.getBoundingClientRect)r=el.getBoundingClientRect();}if(r&&r.height){const wr=wrap.getBoundingClientRect();return ((r.top-wr.top)+scrollTop())/drawW;}}}catch(e){}return (scrollTop()+H*0.3)/drawW;}
async function switchProject(npid){
  if(npid===pid&&editor)return;
  if(editor&&pid!=null)await savePageNow();
  pid=npid;
  const pg=(await db.pages.get(pid))||{};
  strokes=await db.strokes.where('pid').equals(pid).toArray();inkRedo=[];
  gutterW=pg.gutterW||0;
  if(editor){editor.setHTML(pg.html||'');_lastHTML=editor.getHTML();}
  layout();

async function newProject(name){const id=await db.projects.add({name:(name||'Untitled').slice(0,60),created:Date.now()});projects=await db.projects.toArray();await switchProject(id);renderProjects();}
function renameProject(p,name){p.name=(name||p.name).slice(0,60);db.projects.update(p.id,{name:p.name});if(p.id===pid)document.getElementById('proj-name').textContent=p.name;renderProjects();}
async function deleteProject(p){
  if(projects.length<=1){toast('Keep at least one project','err');return;}
  const others=projects.filter(x=>x.id!==p.id);
  const snapProj={id:p.id,name:p.name,created:p.created};
  const snapPage=(await db.pages.get(p.id))||null;
  const snapStrokes=await db.strokes.where('pid').equals(p.id).toArray();
  const snapMarks=marks.filter(m=>m.pid===p.id).map(m=>JSON.parse(JSON.stringify(m)));
  const gone=snapMarks.map(m=>m.id);const qedits=[];
  for(const q of marks)if(q.pid!==p.id&&q.links&&q.links.some(id=>gone.includes(id))){const removed=q.links.filter(id=>gone.includes(id));qedits.push({q,removed});q.links=q.links.filter(id=>!gone.includes(id));saveMark(q);}
  await db.pages.delete(p.id);await db.strokes.where('pid').equals(p.id).delete();await db.marks.where('pid').equals(p.id).delete();await db.projects.delete(p.id);
  marks=marks.filter(m=>m.pid!==p.id);projects=projects.filter(x=>x.id!==p.id);
  if(pid===p.id)await switchProject(others[0].id);
  renderProjects();if(typeof updateBackupLabels==='function')updateBackupLabels();
  toast('Project deleted','ok',{label:'Undo',fn:async()=>{
    await db.projects.put(snapProj);if(snapPage)await db.pages.put(snapPage);
    for(const m of snapMarks)await db.marks.put(m);
    for(const sk of snapStrokes){const c=Object.assign({},sk);delete c.id;c.pid=snapProj.id;await db.strokes.add(c);}
    for(const {q,removed} of qedits)for(const id of removed)if(!q.links.includes(id)){q.links.push(id);saveMark(q);}
    projects=await db.projects.toArray();marks=await db.marks.toArray();
    await switchProject(snapProj.id);renderProjects();if(typeof updateBackupLabels==='function')updateBackupLabels();
  }});
}

function makeDraggable(panel,handle){let sx0,sy0,l0,t0,on=false;handle.addEventListener('pointerdown',e=>{if(e.target.closest('.panel-x')||e.target.closest('input')||e.target.closest('button'))return;on=true;handle.classList.add('drag');const r=panel.getBoundingClientRect();panel.style.left=r.left+'px';panel.style.top=r.top+'px';panel.style.right='auto';sx0=e.clientX;sy0=e.clientY;l0=r.left;t0=r.top;handle.setPointerCapture(e.pointerId);});handle.addEventListener('pointermove',e=>{if(!on)return;panel.style.left=Math.max(4,Math.min(window.innerWidth-60,l0+e.clientX-sx0))+'px';panel.style.top=Math.max(4,Math.min(window.innerHeight-60,t0+e.clientY-sy0))+'px';});const end=()=>{on=false;handle.classList.remove('drag');};handle.addEventListener('pointerup',end);handle.addEventListener('pointercancel',end);}
function typeIcon(t){const c=mtype(t).c;const m={note:'<path d="M6 4h12v16l-6-3-6 3z"/>',task:'<path d="M5 12l4 4L19 6"/>',question:'<path d="M9 9a3 3 0 1 1 4 2.8c-1 .5-1 1-1 2.2"/><circle cx="12" cy="18" r="1"/>',answer:'<path d="M21 12a9 9 0 1 1-9-9"/><path d="M9 12l2 2 5-5"/>'}[t]||'';return '<svg width="15" height="15" viewBox="0 0 24 24" stroke="'+c+'" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">'+m+'</svg>';}

function mergeMarks(src,tgt){
  if(!tgt||tgt===src)return;
  tgt.name=tgt.name||src.name;
  tgt.tags=Array.from(new Set([...(tgt.tags||[]),...(src.tags||[])]));
  tgt.links=Array.from(new Set([...(tgt.links||[]),...(src.links||[])]));
  if(src.done&&!tgt.done){tgt.done=true;tgt.doneAt=src.doneAt||Date.now();}
  tgt.created=Math.min(tgt.created,src.created);
  for(const q of marks)if(q.links&&q.links.includes(src.id)){q.links=q.links.map(x=>x===src.id?tgt.id:x).filter((v,i,a)=>a.indexOf(v)===i);saveMark(q);}
  saveMark(tgt);deleteMark(src).then(()=>{redrawInk();openMarkPopup(tgt);toast('Merged','ok');});
}

function openSearch(){ensureSearch();searchPanel.style.display='flex';searchPanel.style.left=Math.max(8,(window.innerWidth-540)/2)+'px';searchPanel.style.top='9vh';searchPanel.style.right='auto';const q=searchPanel.querySelector('#search-q');q.value='';renderSearch('');setTimeout(()=>q.focus(),20);}

function searchable(m){return (m.name&&m.name.trim())||(m.tags&&m.tags.length)||m.type!=='note'||(m.anchor&&m.anchor.kind==='text')||m.done;}
function renderSearch(q){
  const list=searchPanel.querySelector('#search-list');list.innerHTML='';const ql=q.toLowerCase();const _fc={all:0,note:0,task:0,question:0,answer:0};for(const _m of marks)if(searchable(_m)){_fc[_m.type]=(_fc[_m.type]||0)+1;_fc.all++;}searchPanel.querySelectorAll('.sp-f').forEach(_b=>{const _v=_b.dataset.v;const _lab={all:'All',note:'Notes',task:'Tasks',question:'Questions',answer:'Answers'}[_v]||_v;_b.textContent=_lab+' ('+(_fc[_v]||0)+')';});
  let res=marks.filter(searchable);

addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();toggleSide(true);setTimeout(()=>document.getElementById('side-q').focus(),70);return;}

/* boot */
(async function(){
  try{await db.open();}catch(e){toast('Storage failed \u2014 Patchwork needs IndexedDB','err');return;}
  if(!await db.info.get('info'))await db.info.add({id:'info'});
  try{if(navigator.storage&&navigator.storage.persist){const granted=await navigator.storage.persist();const persisted=navigator.storage.persisted?await navigator.storage.persisted():granted;const inf=await db.info.get('info');if(!persisted&&!(inf&&inf.persistWarned)){toast('Your notes live only in this browser — use Projects ▸ Backup now and then','info');try{await db.info.update('info',{persistWarned:true});}catch(_){}}}}catch(_){}
  try{const _bc=new BroadcastChannel('patchwork-app');let _others=false;_bc.onmessage=ev=>{if(ev.data==='ping'){_bc.postMessage('pong');}else if(ev.data==='pong'&&!_others){_others=true;toast('Patchwork is open in another tab — editing the same project in two tabs can overwrite changes','err');}};_bc.postMessage('ping');}catch(_){}
  await DB_loadColors();
  projects=await db.projects.toArray();

    const id=await db.projects.add({name:'Main',created:Date.now()});projects=await db.projects.toArray();

    await db.strokes.toCollection().modify(s=>{if(s.pid==null)s.pid=id;});
    await db.marks.toCollection().modify(m=>{if(m.pid==null)m.pid=id;});
  }
  marks=await db.marks.toArray();
  lastActivityT=marks.reduce((a,m)=>Math.max(a,m.created||0),0);
  try{const inf2=await db.info.get('info');const lastBk=(inf2&&inf2.lastBackupAt)||0;if(marks.filter(searchable).length>3&&Date.now()-lastBk>7*864e5)setTimeout(()=>toast('It has been a while since your last backup — Projects ▸ Backup','info'),1800);}catch(_){}
  const meta=await db.meta.get('meta');
  let active=(meta&&meta.activePid&&projects.find(p=>p.id===meta.activePid))?meta.activePid:projects[0].id;
  buildSwatches();setInkColor('#ece6da');buildFilterBar();
  editor=makeEditor('note-ed','note-tb','note-status','note-valign');

  setInterval(checkText,1500);
  noteEd.addEventListener('blur',()=>{checkText();saveMeta();});
  addEventListener('beforeunload',()=>{checkText();if(editor&&pid!=null)db.pages.put({pid,html:editor.getHTML(),scrollYn:scrollTop()/drawW,gutterW});db.meta.put({id:'meta',activePid:pid});});
})();

<script>
"use strict";
/* ===== backup / import + about-legal (shares globals with the main script) ===== */
function _today(){return new Date().toISOString().slice(0,10);}
function _slug(s){return (s||'project').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'project';}
function _download(data,name){const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
function _mexp(m){return{oid:m.id,type:m.type,name:m.name||'',tags:m.tags||[],created:m.created,done:!!m.done,doneAt:m.doneAt||null,links:m.links||[],anchor:m.anchor||{kind:'time',yn:0},snippet:m.snippet||''};}
function _sexp(s){return{t:s.t,tool:s.tool,color:s.color,pts:s.pts,minYn:s.minYn,maxYn:s.maxYn};}
async function backupProject(){
  await savePageNow();
  const pg=(await db.pages.get(pid))||{};
  const data={app:'patchwork',type:'patchwork-backup',version:1,scope:'project',exportedAt:new Date().toISOString(),
    project:{name:projName(pid)},page:{html:pg.html||'',scrollYn:pg.scrollYn||0,gutterW:pg.gutterW||0},
    marks:marks.filter(m=>m.pid===pid).map(_mexp),strokes:(await db.strokes.where('pid').equals(pid).toArray()).map(_sexp)};
  _download(data,'patchwork-'+_slug(projName(pid))+'-'+_today()+'.json');
  toast('Backed up this project: \u201c'+projName(pid)+'\u201d','ok');db.info.update('info',{lastBackupAt:Date.now()}).catch(()=>{});
}
async function backupAll(){
  await savePageNow();
  const pgs=await db.pages.toArray();const allS=await db.strokes.toArray();
  const data={app:'patchwork',type:'patchwork-backup',version:1,scope:'all',exportedAt:new Date().toISOString(),
    projects:projects.map(p=>({oid:p.id,name:p.name,created:p.created})),
    pages:pgs.map(pg=>({poid:pg.pid,html:pg.html||'',scrollYn:pg.scrollYn||0,gutterW:pg.gutterW||0})),
    marks:marks.map(m=>{const oo=_mexp(m);oo.poid=m.pid;return oo;}),
    strokes:allS.map(s=>{const oo=_sexp(s);oo.poid=s.pid;return oo;}),
    colors:{favorites:COLOR_FAVORITES,recents:COLOR_RECENTS}};
  _download(data,'patchwork-all-'+_today()+'.json');
  toast('Backed up everything ('+projects.length+' project'+(projects.length!==1?'s':'')+')','ok');db.info.update('info',{lastBackupAt:Date.now()}).catch(()=>{});
}
function _sani(h){try{return DOMPurify.sanitize(String(h||''));}catch(e){return '';}}
async function importFile(file){
  let data;try{data=JSON.parse(await file.text());}catch(e){toast('Not a valid backup file','err');return;}
  if(!data||data.type!=='patchwork-backup'){toast('That\u2019s not a Patchwork backup','err');return;}
  try{
    let goTo=null,summary='';
    if(data.scope==='all'){goTo=await _impAll(data);summary=(data.projects?data.projects.length:0)+' projects';}
    else{goTo=await _impProject(data);summary='project \u201c'+((data.project&&data.project.name)||'Imported')+'\u201d';}
    projects=await db.projects.toArray();marks=await db.marks.toArray();
    lastActivityT=marks.reduce((a,m)=>Math.max(a,m.created||0),0);
    if(goTo)await switchProject(goTo);
    renderProjects();updateBackupLabels();
    toast('Imported '+summary,'ok');
  }catch(e){console.error(e);toast('Import failed: '+(e.message||'error'),'err');}
}
async function _impProject(data){
  const np=await db.projects.add({name:((data.project&&data.project.name)||'Imported').slice(0,60),created:Date.now()});
  if(data.page){const h=_sani(data.page.html);if(h.length<=MAX_CARD_FIELD)await db.pages.put({pid:np,html:h,scrollYn:data.page.scrollYn||0,gutterW:data.page.gutterW||0});}
  const map={};
  for(const m of (data.marks||[])){const nid=await db.marks.add({pid:np,type:m.type||'note',name:m.name||'',tags:m.tags||[],created:m.created||Date.now(),done:!!m.done,doneAt:m.doneAt||null,links:[],anchor:m.anchor||{kind:'time',yn:0},snippet:m.snippet||''});map[m.oid]=nid;}
  for(const m of (data.marks||[]))if(m.links&&m.links.length&&map[m.oid]){const mm=m.links.map(x=>map[x]).filter(Boolean);if(mm.length)await db.marks.update(map[m.oid],{links:mm});}
  for(const s of (data.strokes||[]))await db.strokes.add({pid:np,t:s.t,tool:s.tool,color:s.color,pts:s.pts,minYn:s.minYn,maxYn:s.maxYn});
  return np;
}
async function _impAll(data){
  const pmap={};
  for(const p of (data.projects||[])){const nid=await db.projects.add({name:(p.name||'Imported').slice(0,60),created:p.created||Date.now()});pmap[p.oid]=nid;}
  for(const pg of (data.pages||[]))if(pmap[pg.poid]!=null){const h=_sani(pg.html);if(h.length<=MAX_CARD_FIELD)await db.pages.put({pid:pmap[pg.poid],html:h,scrollYn:pg.scrollYn||0,gutterW:pg.gutterW||0});}
  const map={};
  for(const m of (data.marks||[])){const np=pmap[m.poid];if(np==null)continue;const nid=await db.marks.add({pid:np,type:m.type||'note',name:m.name||'',tags:m.tags||[],created:m.created||Date.now(),done:!!m.done,doneAt:m.doneAt||null,links:[],anchor:m.anchor||{kind:'time',yn:0},snippet:m.snippet||''});map[m.oid]=nid;}
  for(const m of (data.marks||[]))if(m.links&&m.links.length&&map[m.oid]){const mm=m.links.map(x=>map[x]).filter(Boolean);if(mm.length)await db.marks.update(map[m.oid],{links:mm});}
  for(const s of (data.strokes||[])){const np=pmap[s.poid];if(np!=null)await db.strokes.add({pid:np,t:s.t,tool:s.tool,color:s.color,pts:s.pts,minYn:s.minYn,maxYn:s.maxYn});}
  if(data.colors){if(Array.isArray(data.colors.favorites))COLOR_FAVORITES=Array.from(new Set([...COLOR_FAVORITES,...data.colors.favorites])).slice(0,18);if(Array.isArray(data.colors.recents))COLOR_RECENTS=(data.colors.recents||COLOR_RECENTS).slice(0,8);DB_saveColors();}
  return Object.values(pmap)[0];
}
function updateBackupLabels(){const a=document.getElementById('bk-proj');if(a)a.textContent='\u2913 this project ('+projName(pid)+')';const e=document.getElementById('bk-all');if(e)e.textContent='\u2913 everything ('+projects.length+' project'+(projects.length!==1?'s':'')+')';}
document.getElementById('proj-btn').addEventListener('click',()=>setTimeout(updateBackupLabels,0));

function ensureAbout(){if(aboutPanel)return aboutPanel;aboutPanel=document.createElement('div');aboutPanel.className='panel';aboutPanel.style.width='420px';aboutPanel.style.display='none';
  aboutPanel.innerHTML='<div class="panel-h"><div class="panel-ic"><svg width="15" height="15" viewBox="0 0 24 24" stroke="#818cf8" stroke-width="2" fill="none" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.5" r=".7"/></svg></div><div class="panel-t">About &amp; legal</div><button class="panel-x">\u00d7</button></div><div class="panel-b"><div class="seg" id="ab-tabs"></div><div id="ab-body" style="font-size:12.5px;line-height:1.65;color:#c4c4dc;"></div></div>';
  document.body.appendChild(aboutPanel);
  aboutPanel.querySelector('.panel-x').onclick=()=>aboutPanel.style.display='none';
  const tabs=aboutPanel.querySelector('#ab-tabs');
  [['about','About'],['privacy','Privacy'],['terms','Terms'],['keys','Keys']].forEach(([k,lb])=>{const b=document.createElement('button');b.textContent=lb;b.dataset.k=k;b.onclick=()=>showAbout(k);tabs.appendChild(b);});
  makeDraggable(aboutPanel,aboutPanel.querySelector('.panel-h'));
  const st=document.createElement('style');st.textContent='#ab-body p{margin:0 0 9px;}#ab-body .ab-mut{color:#7a7a92;font-size:11px;}#ab-body code{background:#0f0f18;border:1px solid #26263a;border-radius:4px;padding:0 4px;font-size:11px;}';document.head.appendChild(st);
  return aboutPanel;}
function showAbout(k){ensureAbout();aboutPanel.querySelectorAll('#ab-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));aboutPanel.querySelector('#ab-body').innerHTML=ABOUT[k]||'';}
function openAbout(){ensureAbout();showAbout('about');aboutPanel.style.display='flex';aboutPanel.style.left=Math.max(8,(window.innerWidth-420)/2)+'px';aboutPanel.style.top='12vh';aboutPanel.style.right='auto';}
document.getElementById('about-btn').addEventListener('click',openAbout);
addEventListener('keydown',e=>{if(e.key==='Escape'&&aboutPanel&&aboutPanel.style.display!=='none')aboutPanel.style.display='none';});
document.querySelectorAll('button[title]').forEach(b=>{if(!b.getAttribute('aria-label'))b.setAttribute('aria-label',b.title);});
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
