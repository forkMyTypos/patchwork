</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;height:calc(var(--vh,1vh)*100);}
body{font-family:Arial,Helvetica,sans-serif;background:#111;color:#e0e0e0;overflow:hidden;display:flex;flex-direction:column;
  background-image:radial-gradient(circle at 82% -12%,#1f1a10 0%,#111 55%);}
button{font-family:inherit;}

/* ===== top bars ===== */
#bar1{display:flex;align-items:center;gap:4px;padding:7px 10px;border-bottom:1px solid #1f1f2e;background:#0e0e15;flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
#bar2{display:flex;align-items:center;gap:6px;padding:5px 10px;border-bottom:1px solid #1f1f2e;background:#0c0c12;flex-shrink:0;overflow-x:auto;scrollbar-width:none;min-height:42px;}
#bar1::-webkit-scrollbar,#bar2::-webkit-scrollbar{display:none;}
#brand{display:flex;align-items:center;gap:8px;margin-right:6px;flex-shrink:0;}
#brand .mark{width:24px;height:24px;border-radius:7px;background:#10131f;border:1px solid #5a4a2b;display:flex;align-items:center;justify-content:center;}
#brand .name{font-weight:700;font-size:14px;color:#ede6d8;white-space:nowrap;}
#brand .name b{color:#f59e0b;}
.mbtn{width:32px;height:32px;border-radius:8px;border:1px solid #23232f;background:#13131c;color:#bcbcd0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.1s;}
.mbtn:hover{background:#1c1c28;color:#e0e0e0;}
.mbtn.on{background:#241c0d;border-color:#5a4a2b;color:#fbbf24;}
.mbtn:disabled{opacity:.32;cursor:default;}
.mbtn svg{display:block;pointer-events:none;}
.bsep{width:1px;height:22px;background:#23232f;margin:0 4px;flex-shrink:0;}
#spacer-r{margin-left:auto;}
#now{height:32px;padding:0 11px;border-radius:8px;border:1px solid #23232f;background:#13131c;color:#bcbcd0;font-size:11.5px;cursor:pointer;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:6px;}
#now:hover{border-color:#5a4a2b;color:#fbbf24;}
/* ink controls */
#inkbar{display:none;align-items:center;gap:6px;}
#swatches{display:flex;gap:5px;flex-shrink:0;}
.sw{width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.18);cursor:pointer;flex-shrink:0;padding:0;transition:transform .08s;}
.sw:hover{transform:scale(1.12);}
.sw.on{outline:2px solid #fbbf24;outline-offset:1px;}
#custom{width:30px;height:30px;border-radius:7px;border:1px solid #2a2a3a;background:#13131c;padding:2px;cursor:pointer;flex-shrink:0;}
#sizewrap{display:flex;align-items:center;gap:6px;flex-shrink:0;padding:0 2px;}
#size{width:90px;accent-color:#f59e0b;cursor:pointer;}
#sizeval{font-size:11px;color:#8d8da4;font-family:monospace;min-width:34px;text-align:right;}
#handmsg{display:none;font-size:11.5px;color:#56566e;padding:0 4px;}

/* ===== stage / layers ===== */
#stage{flex:1;min-height:0;position:relative;}
#wrap{position:absolute;inset:0;overflow-y:scroll;overflow-x:hidden;touch-action:pan-y;z-index:1;}
#wrap::-webkit-scrollbar{width:10px;}
#wrap::-webkit-scrollbar-thumb{background:#2a2330;border-radius:6px;border:2px solid #0e0e15;}
#wrap::-webkit-scrollbar-track{background:transparent;}
#pad{position:relative;min-height:100%;}
#ink{position:absolute;inset:0;display:block;z-index:5;pointer-events:none;touch-action:none;}

/* ===== rich text editor (module) ===== */
.toolbar{display:flex;align-items:center;gap:3px;flex-wrap:nowrap;}
.tbtn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:5px;color:#bbb;border:none;background:transparent;font-size:12px;font-weight:500;flex-shrink:0;user-select:none;transition:background .1s;}
.tbtn:hover{background:#23232f;}.tbtn.on{background:#1e3a5f;color:#60a5fa;}
.tsep{width:1px;height:16px;background:#2a2a3a;margin:0 1px;flex-shrink:0;}
.toolbar select,.toolbar input[type="number"]{height:24px;font-size:11px;padding:0 3px;border:1px solid #2a2a3a;border-radius:5px;background:#111;color:#bbb;}
.toolbar select{max-width:120px;}
.toolbar input[type="number"]{width:40px;text-align:center;}
.color-btn{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:26px;height:26px;border-radius:5px;cursor:pointer;user-select:none;flex-shrink:0;transition:background .1s;}
.color-btn:hover{background:#23232f;}
.color-btn.on{background:#1e3a5f;}
.color-btn .cletter{font-size:12px;font-weight:600;line-height:1;color:#bbb;}
.color-btn .cbar{height:3px;width:16px;border-radius:2px;margin-top:2px;transition:background .15s;}
.color-pop{position:fixed;z-index:10000;background:#1c1c28;border:1px solid #3a3a4a;border-radius:10px;padding:10px;box-shadow:0 8px 28px rgba(0,0,0,.5);width:196px;display:none;}
.color-pop.open{display:block;}
.color-pop .cp-row{display:flex;align-items:center;gap:7px;width:100%;background:transparent;border:none;color:#c0c0d8;font-size:12px;font-family:inherit;cursor:pointer;padding:6px;border-radius:6px;text-align:left;}
.color-pop .cp-row:hover{background:#262635;}
.color-pop .cp-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5a5a72;margin:9px 2px 5px;}
.color-pop .cp-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;}
.color-pop .cp-fav-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;}
.color-pop .cp-sw{width:100%;aspect-ratio:1;border-radius:4px;border:1px solid rgba(255,255,255,.12);cursor:pointer;position:relative;transition:transform .08s,border-color .1s;padding:0;}
.color-pop .cp-sw:hover{transform:scale(1.14);border-color:rgba(255,255,255,.45);z-index:1;}
.color-pop .cp-fav{width:100%;aspect-ratio:1;border-radius:5px;border:1px solid rgba(255,255,255,.18);cursor:pointer;position:relative;transition:transform .08s;padding:0;}
.color-pop .cp-fav:hover{transform:scale(1.1);}
.color-pop .cp-fav .cp-x{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:#2a2a3a;border:1px solid #4a4a5a;color:#ddd;font-size:10px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;}
.color-pop .cp-fav:hover .cp-x{display:flex;}
.color-pop .cp-fav-add{width:100%;aspect-ratio:1;border-radius:5px;border:1px dashed #4a4a5a;background:transparent;color:#7a7a92;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;position:relative;padding:0;}
.color-pop .cp-fav-add:hover{border-color:#60a5fa;color:#60a5fa;}
.color-pop .cp-divider{height:1px;background:#2a2a38;margin:9px 0;}
.color-pop .cp-current{position:relative;}
.color-pop .cp-current .cp-cur-sw{width:16px;height:16px;border-radius:4px;border:1px solid rgba(255,255,255,.25);flex-shrink:0;}
.color-pop .cp-current span:nth-child(2){flex:1;}
.color-pop .cp-current .cp-cur-hex{font-family:monospace;font-size:10px;color:#7a7a92;}
.color-pop .cp-star{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:#2a2a3a;border:1px solid #4a4a5a;color:#fbbf24;font-size:8px;line-height:1;display:none;align-items:center;justify-content:center;cursor:pointer;}
.color-pop .cp-fav:hover .cp-star{display:flex;}
.img-resize-group{display:none;align-items:center;gap:5px;border:1px solid #3a5a3a;border-radius:7px;padding:2px 6px;height:26px;background:#161e16;}
.img-resize-group.visible{display:flex;}
.img-resize-group .resize-label{font-size:10px;color:#7dba7d;white-space:nowrap;user-select:none;}
.img-resize-group input[type="range"]{width:64px;height:4px;accent-color:#4caf50;cursor:pointer;}
.img-resize-group .resize-val{font-size:10px;color:#7dba7d;min-width:30px;text-align:right;font-family:monospace;}
/* infinite, top-aligned flow (valign neutralised for a scrolling page) */
.editor-valign-wrap{position:static;display:block;overflow:visible;}
.editor{outline:none;font-size:15px;line-height:1.75;color:#e0e0e0;cursor:text;caret-color:#e0e0e0;padding:18px 20px 45vh 70px;min-height:60vh;}
.editor .line{min-height:1.75em;white-space:pre-wrap;word-break:break-word;}
.img-run{display:inline-block;vertical-align:middle;position:relative;}
.img-run.img-selected img{outline:2px solid #4caf50;border-radius:2px;}
.status{display:none;}

#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(18px);background:#13131e;border:1px solid #2a2a3a;color:#c0c0e0;font-size:12px;padding:8px 16px;border-radius:9px;box-shadow:0 4px 20px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.2s;z-index:11000;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.ok{border-color:#22543d;color:#4ade80;}#toast.err{border-color:#7f1d1d;color:#f87171;}#toast.info{border-color:#1e3a5f;color:#60a5fa;}
#hint{position:absolute;left:50%;top:34%;transform:translateX(-50%);text-align:center;color:#4a4a60;font-size:14px;line-height:2;pointer-events:none;user-select:none;z-index:6;}
#hint b{color:#6a5a35;}
@media (max-width:560px){#brand .name{display:none;}#size{width:66px;}.editor{padding-left:54px;}}

/* ===== marks / panels (riffrolled-style) ===== */
:root{--accent:#818cf8;--accent2:#6366f1;--panel:#15151f;--pborder:#2a2a3a;--pmut:#8a8aa4;}
#gut{position:absolute;left:0;top:0;bottom:0;z-index:6;width:70px;}
#gut-grip{position:absolute;top:0;bottom:0;right:0;width:8px;cursor:col-resize;}
#gut-grip:hover{background:linear-gradient(90deg,transparent,rgba(129,140,248,.3));}
#gut-tools{position:absolute;top:6px;right:13px;display:flex;gap:8px;align-items:center;z-index:7;}#gut-add{width:26px;height:26px;border-radius:50%;border:1px solid #5a4a2b;background:#1a1510;color:#fbbf24;font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
#gut-add:hover{background:#241c0d;}
#bar2{position:relative;}
#bar2 #gut-tools{position:absolute;left:0;top:0;bottom:0;right:auto;justify-content:center;gap:8px;border-right:1px solid #2a2233;background:#0c0c12;}
.panel{position:fixed;z-index:9000;background:var(--panel);border:1px solid var(--pborder);border-radius:13px;box-shadow:0 24px 70px rgba(0,0,0,.6);color:#e6e6f0;width:330px;max-width:94vw;display:flex;flex-direction:column;overflow:hidden;}
.panel-h{display:flex;align-items:center;gap:9px;padding:11px 12px;border-bottom:1px solid #20202e;cursor:grab;user-select:none;}
.panel-h.drag{cursor:grabbing;}
.panel-ic{width:26px;height:26px;border-radius:8px;background:#1d1d2b;border:1px solid var(--pborder);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.panel-t{font-weight:700;font-size:13.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.panel-x{width:26px;height:26px;border-radius:7px;border:1px solid var(--pborder);background:#16161f;color:#9090a8;font-size:15px;cursor:pointer;flex-shrink:0;}
.panel-x:hover{color:#f87171;border-color:#5a2b2b;}
.panel-b{padding:12px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;max-height:62vh;}
.pf{display:flex;flex-direction:column;gap:5px;}
.pf-l{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pmut);}
.pf-in{height:32px;background:#0f0f18;border:1px solid #26263a;border-radius:8px;color:#e6e6f0;font-size:13px;padding:0 11px;outline:none;font-family:inherit;}
.pf-in:focus{border-color:var(--accent);}
.seg{display:flex;gap:5px;}
.seg button{flex:1;height:30px;border-radius:8px;border:1px solid #26263a;background:#0f0f18;color:#9898b4;font-size:11.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
.seg button.on{border-color:var(--accent);color:#fff;background:#22223a;}
.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;background:#22223a;border:1px solid #34345a;color:#c4cafc;font-size:11px;}
.chip b{cursor:pointer;color:#7a7ab0;font-weight:400;}.chip b:hover{color:#f87171;}

<script>
"use strict";
/* ===== Patchwork: one endless page \u2014 rich text + free-hand ink, time-stamped ===== */
function _setVH(){const h=(window.visualViewport?window.visualViewport.height:window.innerHeight)*0.01;document.documentElement.style.setProperty('--vh',h+'px');}
_setVH();window.addEventListener('resize',_setVH);window.addEventListener('orientationchange',_setVH);

const MAX_CARD_FIELD=12*1024*1024;
function toast(msg,type,action){const t=document.getElementById('toast');t.innerHTML='';const sp=document.createElement('span');sp.textContent=msg;t.appendChild(sp);if(action&&action.fn){const b=document.createElement('button');b.textContent=action.label||'Undo';b.style.cssText='margin-left:12px;background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:2px 10px;font-size:11px;cursor:pointer;font-family:inherit;';b.onclick=()=>{t.className='';clearTimeout(t._t);try{action.fn();}catch(e){console.error(e);}};t.appendChild(b);}t.className='show '+(type||'info');clearTimeout(t._t);t._t=setTimeout(()=>{t.className='';},action?6500:2600);}

/* ---------- editor module (rich text \u2014 from In a Flash) ---------- */
const DEFAULT_TEXT_COLOR="#e0e0e0";
let COLOR_FAVORITES=[],COLOR_RECENTS=[];
const COLOR_PALETTE=["#ffffff","#d0d0d8","#9090a8","#5a5a72","#f87171","#fb923c","#fbbf24","#facc15","#a3e635","#4ade80","#34d399","#22d3ee","#60a5fa","#818cf8","#a78bfa","#f472b6"];
async function DB_loadColors(){try{const i=await db.info.get('info');COLOR_FAVORITES=Array.isArray(i&&i.colorFavorites)?i.colorFavorites:[];COLOR_RECENTS=Array.isArray(i&&i.colorRecents)?i.colorRecents:[];}catch(e){}}
async function DB_saveColors(){try{await db.info.update('info',{colorFavorites:COLOR_FAVORITES,colorRecents:COLOR_RECENTS});}catch(e){}}
function normalizeHex(v){if(!v)return null;v=String(v).trim().toLowerCase();if(/^[0-9a-f]{6}$/.test(v))v="#"+v;if(/^[0-9a-f]{3}$/.test(v))v="#"+v[0]+v[0]+v[1]+v[1]+v[2]+v[2];return /^#[0-9a-f]{6}$/.test(v)?v:null;}
function pushRecentColor(hex){hex=normalizeHex(hex);if(!hex)return;COLOR_RECENTS=[hex,...COLOR_RECENTS.filter(c=>c!==hex)].slice(0,8);DB_saveColors();}
function addFavoriteColor(hex){hex=normalizeHex(hex);if(!hex)return false;if(COLOR_FAVORITES.includes(hex))return false;COLOR_FAVORITES=[...COLOR_FAVORITES,hex].slice(0,18);DB_saveColors();return true;}
function removeFavoriteColor(hex){COLOR_FAVORITES=COLOR_FAVORITES.filter(c=>c!==hex);DB_saveColors();}

let _draw=null;
function openDrawModal(onInsert){const st=_ensureDrawModal();st.onInsert=onInsert;st.strokes=[];st.active=null;st.drawing=false;st.tool="pen";st.bg="paper";st.canvas.className="bg-paper";_drawBuildSwatches();_drawUpdateUI();st.modal.style.display="flex";st.modal.focus();requestAnimationFrame(()=>{_drawResize();_drawRedraw();});}
function _ensureDrawModal(){
  if(_draw)return _draw;
  const css=document.createElement("style");
  css.textContent=`.draw-modal{position:fixed;inset:0;z-index:10500;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;}.draw-dialog{width:min(900px,95vw);height:min(660px,93vh);background:#161616;border:1px solid #2a2a2a;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.55);}.draw-head{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid #2a2a2a;flex-wrap:wrap;}.draw-head .dh-title{font-size:13px;color:#c0c0d8;font-weight:600;margin-right:2px;}.draw-tool{width:30px;height:30px;border-radius:7px;border:1px solid #2a2a2a;background:#1e1e1e;color:#bbb;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}.draw-tool:hover{background:#2a2a2a;}.draw-tool.on{background:#1e3a5f;border-color:#2b5a8f;color:#60a5fa;}.draw-sep{width:1px;height:22px;background:#2a2a2a;flex-shrink:0;}.draw-size{display:flex;align-items:center;gap:6px;color:#888;font-size:11px;}.draw-size input[type=range]{width:84px;}.draw-size .sz-val{min-width:18px;text-align:right;color:#aaa;}.draw-colors{display:flex;align-items:center;gap:4px;flex-wrap:wrap;max-width:300px;}.draw-sw{width:18px;height:18px;border-radius:4px;border:1px solid rgba(255,255,255,.22);cursor:pointer;}.draw-sw.on{outline:2px solid #fff;outline-offset:1px;}.draw-pick{width:26px;height:26px;border:1px solid #3a3a4a;border-radius:5px;background:#111;cursor:pointer;padding:1px;}.draw-actions{margin-left:auto;display:flex;gap:8px;}.draw-btn{height:30px;padding:0 14px;border-radius:7px;border:1px solid #2a2a2a;background:#1e1e1e;color:#c0c0d8;font-size:12px;cursor:pointer;}.draw-btn:hover{background:#2a2a2a;}.draw-btn.primary{background:#2563eb;border-color:#2563eb;color:#fff;}.draw-btn.primary:hover{background:#1d4ed8;}.draw-btn:disabled{opacity:.4;cursor:not-allowed;}.draw-surface{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:12px;backgrou function typeIcon(t){const c=mtype(t).c;if(!['note','task','question','answer'].includes(t))return '<svg width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5" fill="'+c+'"/></svg>';const m={note:'<path d="M6 4h12v16l-6-3-6 3z"/>',task:'<path d="M5 12l4 4L19 6"/>',question:'<path d="M9 9a3 3 0 1 1 4 2.8c-1 .5-1 1-1 2.2"/><circle cx="12" cy="18" r="1"/>',answer:'<path d="M21 12a9 9 0 1 1-9-9"/><path d="M9 12l2 2 5-5"/>'}[t]||'';return '<svg width="15" height="15" viewBox="0 0 24 24" stroke="'+c+'" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">'+m+'</svg>';}

/* mark popup */
let popup=null,popupMark=null;
function ensurePopup(){if(popup)return popup;popup=document.createElement('div');popup.className='panel';popup.style.display='none';popup.innerHTML='<div class="panel-h"><div class="panel-ic"></div><div class="panel-t"></div><button class="panel-x">\u00d7</button></div><div class="panel-b"></div><div class="panel-f"><button class="pok">OK</button><span class="psave"></span><button class="pdel">Delete</button></div>';document.body.appendChild(popup);popup.querySelector('.panel-x').onclick=closePopup;popup.querySelector('.pdel').onclick=()=>{if(!popupMark)return;const m=popupMark;closePopup();softDeleteMark(m);};popup.querySelector('.pok').onclick=closePopup;makeDraggable(popup,popup.querySelector('.panel-h'));return popup;}
function closePopup(){if(popup)popup.style.display='none';popupMark=null;}
function flagSaved(){const e=popup&&popup.querySelector('.psave');if(e){e.textContent='saved';clearTimeout(e._t);e._t=setTimeout(()=>e.textContent='',1200);}}
function openMarkPopup(m){
  ensurePopup();popupMark=m;
  popup.querySelector('.panel-ic').innerHTML=typeIcon(m.type);
  popup.querySelector('.panel-t').textContent=mtype(m.type).name;
  buildPopupBody(m);popup.style.display='flex';
  let py=120;const hit=pinHits.find(h=>h.m===m);const bar=document.getElementById('bar1').offsetHeight+document.getElementById('bar2').offsetHeight;
  if(hit)py=bar+hit.y;py=Math.max(60,Math.min(window.innerHeight-360,py));
  popup.style.left=Math.min(gutter+16,window.innerWidth-346)+'px';popup.style.top=py+'px';popup.style.right='auto';
  setTimeout(()=>{const ni=popup.querySelector('.pf-in');if(ni&&!m.name)ni.focus();},30);
}
function buildPopupBody(m){
  const b=popup.querySelector('.panel-b');b.innerHTML='';
  const nf=document.createElement('div');nf.className='pf';nf.innerHTML='<div class="pf-l">Name</div>';
  const ni=document.createElement('input');ni.className='pf-in';ni.placeholder='Name\u2026';ni.value=m.name||'';
  ni.oninput=()=>{m.name=ni.value;saveMark(m);redrawInk();flagSaved();};nf.appendChild(ni);b.appendChild(nf);
  const tf=document.createElement('div');tf.className='pf';tf.innerHTML='<div class="pf-l">Type</div>';
  const seg=document.createElement('div');seg.className='seg wrap';
  const types=activeTypeIds().slice();if(!types.includes(m.type))types.unshift(m.type);
  types.forEach(t=>{const bt=document.createElement('button');bt.className=(m.type===t?'on':'');bt.innerHTML='<span class="tb-dot" style="width:8px;height:8px;border-radius:50%;background:'+mtype(t).c+'"></span>'+esc(mtype(t).name);bt.onclick=()=>{m.type=t;saveMark(m);redrawInk();if(editor&&m.anchor&&m.anchor.kind==='text')editor.refresh();openMarkPopup(m);};seg.appendChild(bt);});
  tf.appendChild(seg);b.appendChild(tf);
  const T=ht(m.type);
  // the type's card fields (defined in the Highlight Factory)
  (T.fields||[]).forEach(f=>{const ff=document.createElement('div');ff.className='pf';ff.innerHTML='<div class="pf-l">'+esc(f.label)+'</div>';const ta=document.createElement('textarea');ta.className='pf-in pf-ta';ta.rows=2;ta.placeholder=f.label+'…';ta.value=(m.fields&&m.fields[f.id])||'';ta.oninput=()=>{m.fields=m.fields||{};m.fields[f.id]=ta.value;saveMark(m);flagSaved();};ff.appendChild(ta);b.appendChild(ff);});
  const gf=document.createElement('div');gf.className='pf';gf.innerHTML='<div class="pf-l">Tags</div>';
  const gw=document.createElement('div');gw.className='chips';
  const gi=document.createElement('input');gi.className='tagin';gi.placeholder='add tag ↵';gi.maxLength=32;
  function renderTags(){gw.innerHTML='';(m.tags||[]).forEach(tg=>{const c=document.createElement('span');c.className='chip';c.innerHTML=esc(tg)+' <b>×</b>';c.querySelector('b').onclick=()=>{m.tags=m.tags.filter(x=>x!==tg);saveMark(m);renderTags();flagSaved();};gw.appendChild(c);});gw.appendChild(gi);}
  gi.onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();const v=gi.value.trim().toLowerCase().slice(0,32);if(!v)return;m.tags=m.tags||[];if(!m.tags.includes(v))m.tags.push(v);gi.value='';saveMark(m);renderTags();gi.focus();flagSaved();};
  gf.appendChild(gw);b.appendChild(gf);renderTags();
  const wf=document.createElement('div');wf.className='pf';wf.innerHTML='<div class="pf-l">Time added</div><div class="pf-time">'+fmtAbs(m.created)+'</div>';b.appendChild(wf);
  if(T.checkable){
    const cf=document.createElement('div');cf.className='pf';
    const row=document.createElement('label');row.className='pf-row';
    const cb=document.createElement('input');cb.type='checkbox';cb.className='pf-cb';cb.checked=!!m.done;
    cb.onchange=()=>{m.done=cb.checked;m.doneAt=cb.checked?Date.now():null;saveMark(m);redrawInk();buildPopupBody(m);flagSaved();};
    row.appendChild(cb);row.appendChild(document.createTextNode(' Completed'));cf.appendChild(row);
    if(m.done&&m.doneAt){const w2=document.createElement('div');w2.className='pf-time';w2.style.marginTop='4px';w2.textContent='Completed: '+fmtAbs(m.doneAt);cf.appendChild(w2);}
    b.appendChild(cf);
  }
  // outgoing links: allowed when this type "links to" other types (Question -> Answer by default)
  const lt=(T.links||[]).filter(x=>HT.has(x));
  if(lt.length||(m.links&&m.links.length)){
    const names=lt.map(x=>mtype(x).name.toLowerCase());
    const qf=document.createElement('div');qf.className='pf';qf.innerHTML='<div class="pf-l">Links'+(names.length?' → '+esc(names.join(' / ')):'')+'</div>';
    const lw=document.createElement('div');lw.className='chips';
    (m.links||[]).forEach(id=>{const a=markById(id);const c=document.createElement('span');c.className='chip link';const lbl=a?(a.name||a.snippet||'(untitled)')+(a.pid!==m.pid?' · '+projName(a.pid):''):'(deleted)';c.innerHTML=(a?'<span class="tb-dot" style="width:7px;height:7px;border-radius:50%;background:'+mtype(a.type).c+'"></span>':'')+esc(lbl)+' <b>×</b>';c.onclick=e=>{if(e.target.tagName==='B')return;if(a)jumpToMark(a);};c.querySelector('b').onclick=e=>{e.stopPropagation();m.links=m.links.filter(x=>x!==id);saveMark(m);buildPopupBody(m);flagSaved();};lw.appendChild(c);});
    qf.appendChild(lw);
    if(lt.length){const add=document.createElement('button');add.className='pbtn';add.textContent='+ link '+(names.length===1?'a'+(/^[aeiou]/.test(names[0])?'n ':' ')+names[0]:'…');add.onclick=()=>openPicker(m.id,id=>{m.links=m.links||[];if(!m.links.includes(id))m.links.push(id);saveMark(m);buildPopupBody(m);flagSaved();},{types:lt});qf.appendChild(add);}
    b.appendChild(qf);
  }
  // incoming links
  const from=marks.filter(q=>q!==m&&(q.links||[]).includes(m.id));
  const targeted=[...HT.values()].some(x=>(x.links||[]).includes(m.type));
  if(from.length||targeted){
    const af=document.createElement('div');af.className='pf';af.innerHTML='<div class="pf-l">Linked from</div>';
    const lw=document.createElement('div');lw.className='chips';
    if(!from.length)lw.innerHTML='<span class="pf-time">not linked yet — link it from a '+esc([...HT.values()].filter(x=>(x.links||[]).includes(m.type)).map(x=>x.name.toLowerCase()).join(' / '))+'</span>';
    from.forEach(q=>{const c=document.createElement('span');c.className='chip link';c.innerHTML='<span class="tb-dot" style="width:7px;height:7px;border-radius:50%;background:'+mtype(q.type).c+'"></span>'+esc((q.name||'(untitled '+mtype(q.type).name.toLowerCase()+')')+(q.pid!==m.pid?' · '+projName(q.pid):''));c.onclick=()=>jumpToMark(q);lw.appendChild(c);});
    af.appendChild(lw);b.appendChild(af);
  }
  if(m.anchor&&m.anchor.kind==='time'){
    const mf=document.createElement('div');mf.className='pf';
    const mb=document.createElement('button');mb.className='pbtn';mb.textContent='\u2398 merge into another timestamp';
    mb.onclick=()=>openPicker(m.id,id=>mergeMarks(m,markById(id)),'timesame');
    mf.appendChild(mb);b.appendChild(mf);
  }
}
function mergeMarks(src,tgt){
  if(!tgt||tgt===src)return;
  tgt.name=tgt.name||src.name;
  tgt.tags=Array.from(new Set([...(tgt.tags||[]),...(src.tags||[])]));
  tgt.links=Array.from(new Set([...(tgt.links||[]),...(src.links||[])]));
  if(src.done&&!tgt.done){tgt.done=true;tgt.doneAt=src.doneAt||Date.now();}
  tgt.created=Math.min(tgt.created,src.created);
  for(const q of marks)if(q.links&&q.links.includes(src.id)){q.links=q.links.map(x=>x===src.id?tgt.id:x).filter((v,i,a)=>a.indexOf(v)===i);saveMark(q);}
  saveMark(tgt);deleteMark(src).then(()=>{redrawInk();openMarkPopup(tgt);toast('Merged','ok');});
}

/* picker (cross-project) */
let picker=null;
function openPicker(excludeId,onPick,filter){
  if(!picker){picker=document.createElement('div');picker.className='panel';picker.style.width='330px';picker.innerHTML='<div class="panel-h"><div class="panel-ic">'+typeIcon('answer')+'</div><div class="panel-t">Link</div><button class="panel-x">\u00d7</button></div><div class="panel-b"><input class="pf-in" id="pick-q" placeholder="Search marks\u2026"><div class="pk-list" id="pick-list"></div></div>';document.body.appendChild(picker);picker.querySelector('.panel-x').onclick=()=>picker.style.display='none';makeDraggable(picker,picker.querySelector('.panel-h'));}
  picker._exclude=excludeId;picker._onPick=onPick;picker._filter=filter;
  picker.querySelector('.panel-t').textContent=filter==='timesame'?'Merge into\u2026':'Link'+(filter&&filter.types?' \u2192 '+filter.types.map(x=>mtype(x).name).join(' / '):'');
  picker.style.display='flex';picker.style.left=Math.min((window.innerWidth-330)/2,window.innerWidth-340)+'px';picker.style.top='16vh';picker.style.right='auto';
  const q=picker.querySelector('#pick-q');q.value='';renderPicker('');q.oninput=()=>renderPicker(q.value);setTimeout(()=>q.focus(),20);
}
function renderPicker(q){
  const list=picker.querySelector('#pick-list');list.innerHTML='';const ql=q.toLowerCase();const f=picker._filter;const src=markById(picker._exclude);
  let cands=marks.filter(x=>x.id!==picker._exclude);
  if(f==='timesame')cands=cands.filter(x=>x.anchor&&x.anchor.kind==='time'&&x.pid===(src?src.pid:pid));
  else if(f&&f.types)cands=cands.filter(x=>f.types.includes(x.type));
  else cands=cands.filter(x=>(x.name&&x.name.trim())||x.type!=='note'||(x.snippet&&x.snippet.trim()));
  cands=cands.filter(x=>!ql||markText(x).includes(ql)).sort((a,b)=>b.created-a.created).slice(0,80);
  if(!cands.length){list.innerHTML='<div class="sr-empty" style="padding:18px">no matches</div>';return;}
  cands.forEach(x=>{const it=document.createElement('div');it.className='sr';const t=mtype(x.type);const pj=x.pid!==pid?' \u00b7 '+esc(projName(x.pid)):'';it.innerHTML='<span class="sr-b" style="background:'+t.bg+';color:'+t.c+'">'+t.label+'</span><div class="sr-main"><div class="sr-name">'+esc(x.name||x.snippet||fmtAbs(x.created))+'</div><div class="sr-meta">'+fmtTime(x.created)+'<span class="sr-proj">'+pj+'</span></div></div>';it.onclick=()=>{picker._onPick(x.id);picker.style.display='none';};list.appendChild(it);});
}

/* selection tag bar */
const tagbar=document.createElement('div');tagbar.id='tagbar';
// the selection bar is a window onto the active Highlight Profile
function buildTagbar(){tagbar.innerHTML='';activeTypeIds().forEach(t=>{const b=document.createElement('button');b.innerHTML='<span class="tb-dot" style="background:'+mtype(t).c+'"></span>'+esc(mtype(t).name);b.onmousedown=e=>e.preventDefault();b.onclick=()=>tagSelection(t);tagbar.appendChild(b);});const plus=document.createElement('button');plus.className='tb-plus';plus.title='New highlight type (Highlight Factory)';plus.textContent='+';plus.onmousedown=e=>e.preventDefault();plus.onclick=()=>{hideTagbar();if(typeof openFactory==='function')openFactory({create:true,applyToSelection:true});};tagbar.appendChild(plus);}

function hideTagbar(){tagbar.classList.remove('show');}
function updateTagbar(){
  if(mode!=='text'||document.activeElement!==noteEd){hideTagbar();return;}
  const s=window.getSelection();if(!s||s.isCollapsed||!s.rangeCount){hideTagbar();return;}
  const r=s.getRangeAt(0);if(!noteEd.contains(r.commonAncestorContainer)){hideTagbar();return;}
  const rect=r.getBoundingClientRect();if(!rect||(!rect.width&&!rect.height)){hideTagbar();return;}
  tagbar.classList.add('show');const tw=tagbar.offsetWidth||300;
  tagbar.style.left=Math.max(6,Math.min(rect.left,window.innerWidth-tw-6))+'px';

async function tagSelection(type){
  if(!editor.hasSelection()){toast('Select some text first','info');return;}
  const snip=editor.selText().slice(0,200);
  const m=await addMark({type,name:snip.slice(0,80),snippet:snip,anchor:{kind:'text'}},false);
  if(!m)return;
  if(editor.applyMark(m.id)){hideTagbar();redrawInk();flashPin(m.id);openMarkPopup(m);}else{await deleteMark(m);toast('Couldn\u2019t tag \u2014 try selecting again','err');}
}
document.addEventListener('selectionchange',()=>requestAnimationFrame(updateTagbar));

/* search helpers */
function markText(m){const T=ht(m.type);const fv=m.fields?Object.keys(m.fields).map(k=>{const v=m.fields[k];if(!v||!String(v).trim())return '';const f=(T.fields||[]).find(x=>x.id===k);return (f?f.label+' ':'')+v;}).join(' '):'';return ((m.name||'')+' '+(m.snippet||'')+' '+(m.tags||[]).join(' ')+' '+T.name+' '+fv+' '+projName(m.pid)).toLowerCase();}
function searchable(m){return (m.name&&m.name.trim())||(m.tags&&m.tags.length)||m.type!=='note'||(m.anchor&&m.anchor.kind==='text')||m.done;}
async function jumpToMark(m){
  if(m.pid!==pid){await switchProject(m.pid);await new Promise(r=>requestAnimationFrame(r));}
  if(m.anchor&&m.anchor.kind==='time'){wrap.scrollTo({top:Math.max(0,m.anchor.yn*drawW-H*0.35),behavior:'smooth'});flashPin(m.id);setTimeout(()=>openMarkPopup(m),280);}
  else{const el=editor.markEl(m.id);if(el){const wr=wrap.getBoundingClientRect(),r=el.getBoundingClientRect();wrap.scrollTo({top:Math.max(0,scrollTop()+(r.top-wr.top)-H*0.35),behavior:'smooth'});el.classList.add('mark-flash');setTimeout(()=>el.classList.remove('mark-flash'),1100);}setTimeout(()=>openMarkPopup(m),280);}
}

/* gutter interaction */
let _pinDrag=null,_pinMoved=false,_suppressGut=false;
gut.addEventListener('pointerdown',e=>{if(e.target.closest('#gut-tools')||e.target.closest('#gut-grip'))return;const r=wrap.getBoundingClientRect();const cy=e.clientY-r.top;let best=null,bd=15;for(const h of pinHits){const d=Math.abs(h.y-cy);if(d<bd){bd=d;best=h.m;}}if(!best||!(best.anchor&&best.anchor.kind==='time'))return;_pinDrag={m:best,startY:e.clientY};_pinMoved=false;try{gut.setPointerCapture(e.pointerId);}catch(_){}});
gut.addEventListener('pointermove',e=>{if(!_pinDrag){const r=wrap.getBoundingClientRect();const cy=e.clientY-r.top;let near=false;for(const h of pinHits){if(Math.abs(h.y-cy)<15&&h.m.anchor&&h.m.anchor.kind==='time'){near=true;break;}}gut.style.cursor=near?'grab':'';return;}if(!_pinMoved&&Math.abs(e.clientY-_pinDrag.startY)<4)return;_pinMoved=true;e.preventDefault();gut.style.cursor='grabbing';const r=wrap.getBoundingClientRect();const yn=((e.clientY-r.top)+scrollTop())/drawW;_pinDrag.m.anchor.yn=Math.max(0,yn);redrawInk();});
gut.addEventListener('pointerup',e=>{if(!_pinDrag)return;const m=_pinDrag.m,moved=_pinMoved;_pinDrag=null;gut.style.cursor='';try{gut.releasePointerCapture(e.pointerId);}catch(_){}if(moved){saveMark(m);_suppressGut=true;redrawInk();if(typeof refreshSideLive==='function')refreshSideLive();}});
gut.addEventListener('pointercancel',()=>{_pinDrag=null;gut.style.cursor='';});
gut.addEventListener('click',e=>{if(_suppressGut){_suppressGut=false;return;}if(e.target.closest('#gut-add')||e.target.closest('#gut-grip')||e.target.closest('#gut-find')||e.target.closest('#gut-tools'))return;const r=wrap.getBoundingClientRect();const cy=e.clientY-r.top;let best=null,bd=15;for(const h of pinHits){const d=Math.abs(h.y-cy);if(d<bd){bd=d;best=h.m;}}if(best)openMarkPopup(best);});
document.getElementById('gut-add').addEventListener('click',()=>{const bottom=contentBottomPx();const yn=(bottom+30)/drawW;addMark({type:'note',name:'',anchor:{kind:'time',yn},auto:false},true);wrap.scrollTo({top:Math.max(0,bottom+30-H*0.55),behavior:'smooth'});});
(function(){const grip=document.getElementById('gut-grip');let on=false;grip.addEventListener('pointerdown',e=>{on=true;grip.setPointerCapture(e.pointerId);e.preventDefault();});grip.addEventListener('pointermove',e=>{if(!on)return;const r=stage.getBoundingClientRect();gutterW=Math.max(40,Math.min(340,e.clientX-r.left));layout();});const end=()=>{if(on){on=false;saveMeta();}};grip.addEventListener('pointerup',end);grip.addEventListener('pointercancel',end);})();

/* modes */
function setMode(m){mode=m;document.querySelectorAll('.mbtn[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));const tb=document.getElementById('note-tb'),inkbar=document.getElementById('inkbar'),hm=document.getElementById('handmsg');hideTagbar();if(m==='text'){tb.style.display='flex';inkbar.style.display='none';hm.style.display='none';cv.style.pointerEvents='none';requestAnimationFrame(()=>noteEd.focus());}else if(m==='hand'){tb.style.display='none';inkbar.style.display='none';hm.style.display='inline';cv.style.pointerEvents='none';noteEd.blur();}else{tb.style.display='none';inkbar.style.display='flex';hm.style.display='none';cv.style.pointerEvents='auto';noteEd.blur();}const _gb=document.getElementById('ink-grab');if(_gb)_gb.classList.toggle('on',m==='grab');if(m!=='grab')grabSel.clear();}
document.querySelectorAll('.mbtn[data-mode]').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));

/* ink controls */
function buildSwatches(){const btn=document.getElementById('ink-color');if(btn)btn.onclick=e=>{e.stopPropagation();openInkColorPop(btn);};}
let _inkCP=null;
function _inkCPEl(){if(_inkCP)return _inkCP;_inkCP=document.createElement('div');_inkCP.className='color-pop';_inkCP.id='ink-cp';document.body.appendChild(_inkCP);document.addEventListener('mousedown',e=>{if(_inkCP.classList.contains('open')&&!_inkCP.contains(e.target)&&!(e.target.closest&&e.target.closest('#ink-color')))closeInkCP();});return _inkCP;}
function closeInkCP(){if(_inkCP)_inkCP.classList.remove('open');}
function pickInk(hex){hex=normalizeHex(hex);if(!hex)return;setInkColor(hex);pushRecentColor(hex);renderInkCP();}
function renderInkCP(){if(!_inkCP)return;const cur=inkColor;let h='';
  h+='<div class="cp-row cp-current"><span class="cp-cur-sw" style="background:'+cur+'"></span><span>Current color</span><span class="cp-cur-hex">'+esc(cur)+'</span></div>';
  h+='<button class="cp-row" data-def="1" title="Reset to default"><span class="cp-cur-sw" style="background:'+DEFAULT_INK+'"></span><span>Default color</span></button>';
  h+='<div class="cp-divider"></div><div class="cp-label">Favorites</div><div class="cp-fav-grid">';
  COLOR_FAVORITES.forEach(c=>{h+='<button class="cp-fav" data-hex="'+c+'" style="background:'+c+'" title="'+c+'"><span class="cp-x" data-rm="'+c+'">\u00d7</span></button>';});
  h+='<button class="cp-fav-add" data-add="1" title="Add current to favorites">+</button></div>';
  if(COLOR_RECENTS.length){h+='<div class="cp-label">Recent</div><div class="cp-grid">';COLOR_RECENTS.forEach(c=>{h+='<button class="cp-sw" data-hex="'+c+'" style="background:'+c+'" title="'+c+'"><span class="cp-star" data-fav="'+c+'">\u2605</span></button>';});h+='</div>';}
  h+='<div class="cp-label">Palette</div><div class="cp-grid">';COLOR_PALETTE.forEach(c=>{h+='<button class="cp-sw" data-hex="'+c+'" style="background:'+c+'" title="'+c+'"></button>';});h+='</div>';
  _inkCP.innerHTML=h;
  _inkCP.querySelectorAll('[data-hex]').forEach(b=>b.onclick=e=>{if(e.target.dataset.rm){removeFavoriteColor(e.target.dataset.rm);renderInkCP();return;}if(e.target.dataset.fav){addFavoriteColor(e.target.dataset.fav);renderInkCP();return;}pickInk(b.dataset.hex);});
  const def=_inkCP.querySelector('[data-def]');if(def)def.onclick=()=>pickInk(DEFAULT_INK);
  const add=_inkCP.querySelector('[data-add]');if(add)add.onclick=()=>{if(addFavoriteColor(inkColor))renderInkCP();};}
function openInkColorPop(anchor){_inkCPEl();renderInkCP();_inkCP.classList.add('open');const r=anchor.getBoundingClientRect();const w=200;_inkCP.style.left=Math.max(6,Math.min(r.left,window.innerWidth-w-6))+'px';_inkCP.style.top='0px';const ph=_inkCP.offsetHeight||320;let top=r.bottom+6;if(top+ph>window.innerHeight-6)top=Math.max(6,r.top-ph-6);_inkCP.style.top=top+'px';}

function setInkColor(hex){hex=normalizeHex(hex)||hex;inkColor=hex;const sw=document.querySelector('#ink-color .icb-sw');if(sw)sw.style.background=hex;if(mode==='eraser')setMode('pen');}

document.getElementById('size').addEventListener('input',e=>{inkSize=+e.target.value;document.getElementById('sizeval').textContent=inkSize+' px';});

/* actions + keyboard */
document.getElementById('undo').addEventListener('click',()=>hostUndo());
document.getElementById('redo').addEventListener('click',()=>hostRedo());
document.getElementById('clearink').addEventListener('click',()=>{if(!strokes.length){toast('No ink to clear','info');return;}const _now=Date.now();strokes=[];inkRedo=[];db.strokes.where('pid').equals(pid).modify(s=>{if(!s.del)s.del=_now;});redrawInk();updatePad();refreshSideLive();toast('Ink cleared','ok');});
document.getElementById('now').addEventListener('click',()=>wrap.scrollTo({top:Math.max(0,contentBottomPx()-H*0.6),behavior:'smooth'}));
document.getElementById('gut-find').addEventListener('click',()=>{toggleSide(true);setTimeout(()=>{const q=document.getElementById('side-q');if(q)q.focus();},70);});
document.getElementById('ink-grab').addEventListener('click',()=>{if(mode==='grab'){grabSel.clear();setMode('pen');}else{setMode('grab');}redrawInk();});
document.getElementById('side-x').addEventListener('click',()=>toggleSide(false));
document.getElementById('side-scrim').addEventListener('click',()=>toggleSide(false));
document.getElementById('side-q').addEventListener('input',e=>renderSideResults(e.target.value));
document.getElementById('proj-btn').addEventListener('click',openProjects);
addEventListener('keydown',e=>{
if(mode==='grab'&&(e.key==='Delete'||e.key==='Backspace')&&grabSel.size&&!/^(INPUT|TEXTAREA)$/.test(e.target.tagName)&&!e.target.isContentEditable){e.preventDefault();for(const s of [...grabSel]){const i=strokes.indexOf(s);if(i>=0)strokes.splice(i,1);retireStroke(s);}grabSel.clear();redrawInk();schedulePrune();return;}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='f'){e.preventDefault();toggleSide(true);setTimeout(()=>document.getElementById('side-q').focus(),70);return;}
  if(e.key==='Escape'){const _sd=document.getElementById('side');if(_sd&&_sd.classList.contains('open')){toggleSide(false);return;}if(picker&&picker.style.display!=='none'){picker.style.display='none';return;}if(projPanel&&projPanel.style.display!=='none'){projPanel.style.display='none';return;}if(popup&&popup.style.display!=='none'){closePopup();return;}hideTagbar();return;}
  const tag=(e.target&&e.target.tagName)||'';
  // full-screen views (Lab, Timeline, Explorer) own the keyboard: never undo or switch tools on the hidden page
  if(['hwlab','timeline','explorer'].some(id=>{const el=document.getElementById(id);return el&&el.style.display!=='none';}))return;
  if(document.activeElement===noteEd)return;
  if((e.ctrlKey||e.metaKey)&&!e.altKey){const k=e.key.toLowerCase();if(k==='z'&&!e.shiftKey){e.preventDefault();hostUndo();return;}if((k==='z'&&e.shiftKey)||k==='y'){e.preventDefault();hostRedo();return;}}
  if(e.ctrlKey||e.metaKey||e.altKey)return;if(tag==='INPUT'||tag==='TEXTAREA')return;
  const mm={t:'text',p:'pen',h:'hl',e:'eraser',v:'hand'}[e.key.toLowerCase()];if(mm)setMode(mm);
});
addEventListener('resize',()=>{const yn=scrollTop()/drawW;layout();wrap.scrollTop=yn*drawW;redrawInk();});

/* boot */
(async function(){
  try{await db.open();}catch(e){toast('Storage failed \u2014 Patchwork needs IndexedDB','err');return;}
  if(!await db.info.get('info'))await db.info.add({id:'info'});
  try{if(navigator.storage&&navigator.storage.persist){const granted=await navigator.storage.persist();const persisted=navigator.storage.persisted?await navigator.storage.persisted():granted;const inf=await db.info.get('info');if(!persisted&&!(inf&&inf.persistWarned)){toast('Your notes live only in this browser — use Projects ▸ Backup now and then','info');try{await db.info.update('info',{persistWarned:true});}catch(_){}}}}catch(_){}
  try{const _bc=new BroadcastChannel('patchwork-app');let _others=false;_bc.onmessage=ev=>{if(ev.data==='ping'){_bc.postMessage('pong');}else if(ev.data==='pong'&&!_others){_others=true;toast('Patchwork is open in another tab — editing the same project in two tabs can overwrite changes','err');}};_bc.postMessage('ping');}catch(_){}
  await DB_loadColors();
  if(typeof extBoot==='function')await extBoot();
  projects=await db.projects.toArray();
  if(!projects.length){
    const id=await db.projects.add({name:'Main',created:Date.now()});projects=await db.projects.toArray();
    const legacy=await db.meta.get('meta');
    if(legacy&&legacy.html!==undefined)await db.pages.put({pid:id,html:legacy.html||'',scrollYn:legacy.scrollYn||0,gutterW:legacy.gutterW||0});
    await db.strokes.toCollection().modify(s=>{if(s.pid==null)s.pid=id;});
    await db.marks.toCollection().modify(m=>{if(m.pid==null)m.pid=id;});
  }
  marks=await db.marks.toArray();
  lastActivityT=marks.reduce((a,m)=>Math.max(a,m.created||0),0);
  try{const inf2=await db.info.get('info');const lastBk=(inf2&&inf2.lastBackupAt)||0;if(marks.filter(searchable).length>3&&Date.now()-lastBk>7*864e5)setTimeout(()=>toast('It has been a while since your last backup — Projects ▸ Backup','info'),1800);}catch(_){}
  const meta=await db.meta.get('meta');
  let active=(meta&&meta.activePid&&projects.find(p=>p.id===meta.activePid))?meta.activePid:projects[0].id;
  buildSwatches();setInkColor('#ece6da');buildFilterBar();
  editor=makeEditor('note-ed','note-tb','note-status','note-valign');
  pid=active;const pg=(await db.pages.get(pid))||{};
  strokes=(await db.strokes.where('pid').equals(pid).toArray()).filter(s=>!s.del);
  gutterW=pg.gutterW||0;
  if(typeof extBeforePageLoad==='function')await extBeforePageLoad(pg);
  editor.setHTML(pg.html||'');_lastHTML=editor.getHTML();
  document.getElementById('proj-name').textContent=projName(pid);
  layout();redrawInk();updatePad();setMode('text');if(typeof extAfterPageLoad==='function')extAfterPageLoad();
  requestAnimationFrame(()=>{wrap.scrollTop=(pg.scrollYn||0)*drawW;redrawInk();});
  setInterval(checkText,1500);
  noteEd.addEventListener('blur',()=>{checkText();saveMeta();schedulePrune();});
  addEventListener('beforeunload',()=>{checkText();if(typeof historyFlush==='function')historyFlush();if(editor&&pid!=null)db.pages.put({pid,html:editor.getHTML(),scrollYn:scrollTop()/drawW,gutterW});db.meta.put({id:'meta',activePid:pid});});
})();

<script>
"use strict";
/* ===== image store: pictures live once, as Blobs, in IndexedDB (never uploaded) =====
   Page HTML refers to them as pw-img:<hash>. Identical images are stored once, so history snapshots stay tiny. */
const IMG_URLS=new Map();          // hash -> object URL
const IMG_PENDING=new Set();
const BLANK_GIF='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
function _cyrb53(str,seed){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(16).padStart(14,'0');}
function contentHash(str){return _cyrb53(str,1)+_cyrb53(str,7)+str.length.toString(36);}
function imgHashOf(src){const m=/^pw-img:([0-9a-z]+)$/.exec(src||'');return m?m[1]:null;}
function resolveImg(src){const h=imgHashOf(src);if(!h)return src;const u=IMG_URLS.get(h);if(u)return u;loadImages([h]).then(()=>{if(editor)editor.refresh();});return BLANK_GIF;}
async function loadImages(hashes){const need=hashes.filter(h=>!IMG_URLS.has(h)&&!IMG_PENDING.has(h));if(!need.length)return;need.forEach(h=>IMG_PENDING.add(h));try{const rows=await db.images.bulkGet(need);rows.forEach((r,i)=>{if(r&&r.blob)IMG_URLS.set(need[i],URL.createObjectURL(r.blob));});}catch(e){console.error(e);}finally{need.forEach(h=>IMG_PENDING.delete(h));}}
function imageRefsIn(str){const out=new Set();String(str||'').replace(/pw-img:([0-9a-z]+)/g,(_,h)=>{out.add(h);return _;});return [...out];}
async function storeDataURL(url){const h=contentHash(url);if(!IMG_URLS.has(h)){const blob=await (await fetch(url)).blob();if(!(await db.images.get(h)))await db.images.put({h,blob,type:blob.type,size:blob.size,created:Date.now()});IMG_URLS.set(h,URL.createObjectURL(blob));}return 'pw-img:'+h;}
let _interning=null;
// Move every inline data: image in the live page into the store (also migrates pages saved before v4).
async function internImages(){if(!editor)return 0;if(_interning)return _interning;_interning=(async()=>{const found=[];editor.mapImageSrc(src=>{if(/^data:image\//i.test(src))found.push(src);return null;});if(!found.length)return 0;const map={};for(const u of found){try{map[u]=await storeDataURL(u);}catch(e){_quotaToast(e);}}editor.mapImageSrc(src=>map[src]||null);return found.length;})();try{return await _interning;}finally{_interning=null;}}
function _blobToDataURL(b){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b);});}
// Backups stay self-contained: swap pw-img refs back to data: URLs.
/* ===== extension lifecycle (called from the main script) ===== */
async function extBoot(){const gt=document.getElementById('gut-tools'),b2=document.getElementById('bar2');if(gt&&b2)b2.appendChild(gt);await loadHighlightTypes();}
async function extBeforePageLoad(pg){await loadImages(imageRefsIn(pg&&pg.html));}
function extAfterPageLoad(){
  internImages().then(n=>{if(n)saveMeta();});
  requestAnimationFrame(()=>{adoptLegacyStamps();if(typeof historyStart==='function')historyStart();});
}
// Pages from before paragraph times: give each paragraph the time of the old automatic margin stamp beside it.
function adoptLegacyStamps(){if(!editor||!editor.paraRects)return;const olds=pageMarks().filter(isLegacyAutoStamp);if(!olds.length)return;const wr=wrap.getBoundingClientRect(),st=scrollTop(),band=26;const map={};
  for(const r of editor.paraRects()){if(r.t||!r.has)continue;const b=r.el.getBoundingClientRect(),top=(b.top-wr.top)+st,bot=top+b.height;let best=null;for(const m of olds){const y=m.anchor.yn*drawW;if(y>=top-band&&y<=bot+band&&(best==null||m.created<best))best=m.created;}if(best)map[r.i]=best;}
  // paragraphs below a stamp (same session) inherit it too, so the margin shows the session, not a hole
  let carry=null;for(const r of editor.paraRects()){if(map[r.i])carry=map[r.i];else if(!r.t&&r.has&&carry)map[r.i]=carry;}
  if(Object.keys(map).length&&editor.stampParas((i)=>map[i]||null))redrawInk();}

/* ===== highlight types + profiles: storage ===== */
async function loadHighlightTypes(){
  try{
    let rows=await db.htypes.toArray();
    if(!rows.length){rows=BUILTIN_TYPES.map(t=>Object.assign({},t,{created:0}));await db.htypes.bulkPut(rows);}
    HT.clear();rows.forEach(t=>HT.set(t.id,t));
    let profs=await db.profiles.toArray();
    if(!profs.length){profs=[{id:'default',name:'Default',types:['note','task','question','answer'],hidden:[],order:0}];await db.profiles.bulkPut(profs);}
    PROFILES=profs.sort((a,b)=>(a.order||0)-(b.order||0));
    const inf=await db.info.get('info');activeProfileId=(inf&&inf.activeProfile&&PROFILES.some(p=>p.id===inf.activeProfile))?inf.activeProfile:PROFILES[0].id;
  }catch(e){console.error('highlight types',e);}
  buildTagbar();
}
function newId(prefix){return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function saveType(t){HT.set(t.id,t);db.htypes.put(t).catch(_quotaToast);typesChanged();}
function saveProfiles(){PROFILES.forEach((p,i)=>p.order=i);db.profiles.bulkPut(PROFILES).catch(_quotaToast);}
function typeUsage(id){let n=0;for(const m of marks)if(m.type===id)n++;return n;}
let _typesT=null;
function typesChanged(){buildTagbar();clearTimeout(_typesT);_typesT=setTimeout(()=>{if(editor)editor.refresh();const sd=document.getElementById('side');if(sd&&sd.classList.contains('open'))buildFilterBar();redrawInk();if(popup&&popup.style.display!=='none'&&popupMark)buildPopupBody(popupMark);if(typeof refreshExplorer==='function')refreshExplorer();},60);}
function setActiveProfile(id){activeProfileId=id;db.info.update('info',{activeProfile:id}).catch(()=>{});typesChanged();}

/* ===== the Highlight Factory: a small workshop for the tools you mark your page with ===== */
let factory=null,fxOpenId=null,fxApplyNext=false;
const FX_KEYS=[['bg','Background'],['ul','Underline'],['tc','Text colour'],['b','Bold'],['i','Italic'],['s','Strike']];
function ensureFactory(){if(factory)return factory;factory=document.createElement('div');factory.className='panel factory';factory.style.display='none';
  factory.innerHTML='<div class="panel-h"><div class="panel-ic"><svg width="15" height="15" viewBox="0 0 24 24" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M5 20V10l4 3V10l4 3V6h3l1 14"/></svg></div><div class="panel-t">Highlight Factory</div><button class="panel-x">×</button></div><div class="panel-b" id="fx-body"></div>';
  document.body.appendChild(factory);factory.querySelector('.panel-x').onclick=closeFactory;makeDraggable(factory,factory.querySelector('.panel-h'));return factory;}
function openFactory(o){o=o||{};ensureFactory();fxApplyNext=!!o.applyToSelection;if(o.create){const t=createType();fxOpenId=t.id;}else if(o.focus)fxOpenId=o.focus;
  if(factory.style.display==='none'){factory.style.display='flex';factory.style.left=Math.max(8,Math.min(window.innerWidth-470,window.innerWidth-490))+'px';factory.style.top='64px';factory.style.right='auto';}
  renderFactory();if(o.create)setTimeout(()=>{const n=factory.querySelector('.fx-name');if(n){n.focus();n.select();}},40);}
function closeFactory(){if(factory)factory.style.display='none';fxApplyNext=false;}
function createType(){const used=new Set([...HT.values()].map(t=>t.color));const color=COLOR_PALETTE.slice(4).find(c=>!used.has(c))||'#60a5fa';
  const t={id:newId('ht_'),name:'New type',color,fx:{bg:true,ul:true},margin:true,checkable:false,links:[],fields:[],created:Date.now()};
  saveType(t);const p=activeProfile();p.types.push(t.id);saveProfiles();return t;}
function renderFactory(){if(!factory||factory.style.display==='none')return;const body=factory.querySelector('#fx-body');const keepScroll=body.scrollTop;body.innerHTML='';const P=activeProfile();
  // profile row
  const pr=document.createElement('div');pr.className='fx-prof';
  const sel=document.createElement('select');sel.className='fx-sel';PROFILES.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent=p.name;if(p.id===P.id)o.selected=true;sel.appendChild(o);});sel.onchange=()=>{setActiveProfile(sel.value);fxOpenId=null;renderFactory();toast('Profile: '+activeProfile().name,'info');};
  const btn=(txt,title,fn,cls)=>{const b=document.createElement('button');b.className='fx-ib'+(cls?' '+cls:'');b.textContent=txt;b.title=title;b.onclick=fn;return b;};
  pr.innerHTML='<span class="pf-l">Profile</span>';pr.appendChild(sel);
  pr.appendChild(btn('✎','Rename profile',()=>{const n=(prompt('Rename profile',P.name)||'').trim();if(n){P.name=n.slice(0,40);saveProfiles();renderFactory();}}));
  pr.appendChild(btn('⧉','Duplicate profile (copies its types, so you can change them freely)',()=>{const n=(prompt('Name for the copy',P.name+' — copy')||'').trim();if(!n)return;const idmap={};const types=P.types.map(id=>{const o=HT.get(id);if(!o)return null;const c=JSON.parse(JSON.stringify(o));c.id=newId('ht_');c.builtin=false;c.created=Date.now();c.copiedFrom=o.id;idmap[o.id]=c.id;return c;}).filter(Boolean);types.forEach(c=>{c.links=(c.links||[]).map(x=>idmap[x]||x);saveType(c);});const np={id:newId('pf_'),name:n.slice(0,40),types:types.map(c=>c.id),hidden:(P.hidden||[]).map(x=>idmap[x]).filter(Boolean)};PROFILES.push(np);saveProfiles();setActiveProfile(np.id);renderFactory();toast('Duplicated — the original is unchanged','ok');}));
  pr.appendChild(btn('+','New empty profile',()=>{const n=(prompt('New profile name','')||'').trim();if(!n)return;const np={id:newId('pf_'),name:n.slice(0,40),types:[],hidden:[]};PROFILES.push(np);saveProfiles();setActiveProfile(np.id);renderFactory();}));
  const del=btn('🗑','Delete profile (its types stay available)',()=>{if(PROFILES.length<=1){toast('Keep at least one profile','err');return;}if(!del.classList.contains('armed')){del.classList.add('armed');del.textContent='✓?';setTimeout(()=>{del.classList.remove('armed');del.textContent='🗑';},2500);return;}PROFILES=PROFILES.filter(x=>x!==P);db.profiles.delete(P.id).catch(()=>{});saveProfiles();setActiveProfile(PROFILES[0].id);renderFactory();toast('Profile deleted — highlights are untouched','ok');});pr.appendChild(del);
  body.appendChild(pr);
  const hint=document.createElement('div');hint.className='fx-hint';hint.textContent='Select text on the page and these appear in the selection bar, in this order. Drag ⠇⠇ to reorder.';body.appendChild(hint);
  // active / hidden / library
  const vis=P.types.filter(id=>HT.has(id)&&!(P.hidden||[]).includes(id)),hid=P.types.filter(id=>HT.has(id)&&(P.hidden||[]).includes(id)),lib=[...HT.keys()].filter(id=>!P.types.includes(id));
  const sec=(label)=>{const d=document.createElement('div');d.className='fx-sec';d.textContent=label;body.appendChild(d);};
  const list=document.createElement('div');list.className='fx-list';body.appendChild(list);
  if(!vis.length){const e=document.createElement('div');e.className='fx-empty';e.textContent='No highlight types on the selection bar yet.';list.appendChild(e);}
  vis.forEach(id=>list.appendChild(typeRow(id,'on')));enableReorder(list);
  const add=document.createElement('button');add.className='pbtn fx-add';add.textContent='+ New highlight type';add.onclick=()=>openFactory({create:true});body.appendChild(add);
  if(hid.length){sec('Hidden — kept, and their highlights still show');const hl=document.createElement('div');hl.className='fx-list';hid.forEach(id=>hl.appendChild(typeRow(id,'hidden')));body.appendChild(hl);}

// A correction becomes new personal examples: each letter the recogniser got wrong is saved as the letter you meant.
async function hwTeach(r,fixed,pad){const want=fixed.replace(/\s+/g,'');const parts=r.tokens.flatMap(t=>t.list[0].parts);const got=r.tokens.map(t=>t.list[0].text).join('');

  if(want.length!==parts.length)return{saved:0,msg:'Remembered the word'+(fixed.includes(' ')?'s':'')+', but the letter count differs from what Patchwork split the writing into ('+parts.length+'), so no letter shapes were learned.'};
  let n=0;const frame={base:r.seg.base,xh:r.seg.lineH};for(let k=0;k<parts.length;k++){if(want[k]===got[k])continue;const strokes=parts[k].g.m.idx.map(i=>pad.strokes[i]).filter(Boolean);if(!strokes.length)continue;await hwAddSample(want[k],strokes,frame,'correction');n++;}
  return{saved:n,msg:n?'Learned '+n+' corrected letter'+(n>1?'s':'')+' as new examples of your handwriting.':'Nothing new to learn — the letters already matched.'};}

function hwRenderCheck(box,auto){const go=()=>{box.innerHTML='<div class="hw-hint">Testing every example against the others…</div>';setTimeout(()=>{const r=HWCore.selfTest(HWS.model);
    if(!r.n){box.innerHTML='<div class="hw-note">Write at least two examples of some characters, then Patchwork can test how well it tells them apart.</div>';return;}
    const pairs=r.pairs.slice(0,6);box.innerHTML='<div class="hw-checkres"><div><span class="hw-big">'+Math.round(r.accuracy*100)+'%</span> of your examples are recognised from your other examples.</div>'+(pairs.length?'<div class="hw-p">Patchwork needs more information to tell these apart in your writing:</div><div class="hw-pairs">'+pairs.map(p=>'<span class="hw-pair'+(p.kind==='confused'?' bad':'')+'">'+esc(p.pair.join(' / '))+'</span>').join('')+'</div><button class="fx-primary hw-practise">Practise these</button>':'<div class="hw-p">No characters are being confused. 🎉</div>')+'<button class="fx-link hw-recheck">Test again</button></div>';
    const pr=box.querySelector('.hw-practise');if(pr)pr.onclick=()=>{const q=[];pairs.slice(0,4).forEach(p=>{for(let k=0;k<3;k++)p.pair.forEach(ch=>q.push(ch));});hwTab('cal',{queue:q,title:'Targeted practice: '+pairs.slice(0,4).map(p=>p.pair.join(' ')).join(' · ')});};
    box.querySelector('.hw-recheck').onclick=go;},20);};
  if(auto&&HWS.model.length)go();else box.innerHTML=HWS.model.length?'<button class="pbtn hw-run">Check my handwriting model</button> <span class="hw-hint">finds characters that look alike in your writing and asks for more of exactly those</span>':'';const rb=box.querySelector('.hw-run');if(rb)rb.onclick=go;}
function hwShowChar(ch,cell){const own=HWS.samples.filter(s=>s.ch===ch);let pop=document.getElementById('hw-charpop');if(pop)pop.remove();pop=document.createElement('div');pop.id='hw-charpop';
  pop.innerHTML='<div class="hw-row"><b class="hw-cch">'+esc(ch)+'</b><span class="hw-hint">'+own.length+' example'+(own.length!==1?'s':'')+'</span><button class="pbtn hw-more">+ write more</button><button class="panel-x">×</button></div><div class="hw-samps"></div>';
  const sp=pop.querySelector('.hw-samps');own.forEach(s=>{const d=document.createElement('div');d.className='hw-samp';d.innerHTML='<canvas></canvas><span>'+esc(s.src||'')+'</span><button title="Delete this example">×</button>';sp.appendChild(d);requestAnimationFrame(()=>hwThumb(d.querySelector('canvas'),s.strokes));d.querySelector('button').onclick=async()=>{await hwDeleteSample(s.id);d.remove();};});
  pop.querySelector('.panel-x').onclick=()=>{pop.remove();hwModelTab();};pop.querySelector('.hw-more').onclick=()=>{pop.remove();hwTab('cal',{queue:[ch,ch,ch],title:'More examples of “'+ch+'”'});};
  cell.closest('.hw-model').appendChild(pop);pop.scrollIntoView({block:'nearest'});}

/* --- from the page: recognise selected ink without changing it --- */
function hwFromSelection(){if(mode!=='grab'||!grabSel.size){toast('Choose the arrow tool and select some handwriting first','info');return;}
  const sel=[...grabSel].filter(s=>s.tool==='pen').sort((a,b)=>(a.t-b.t)||((a.id||0)-(b.id||0)));if(!sel.length){toast('Select pen strokes (highlighter/eraser strokes are ignored)','info');return;}
  const strokes=sel.map(s=>s.pts.map(p=>({x:p.xn*1000,y:p.yn*1000,p:.5})));openLab('word',{strokes});}
document.getElementById('hw-lab-btn').addEventListener('click',()=>openLab());
document.getElementById('ink-recognize').addEventListener('click',hwFromSelection);

async function inlineImagesForExport(html){const hs=imageRefsIn(html);if(!hs.length)return html;const rows=await db.images.bulkGet(hs);const map={};for(let i=0;i<hs.length;i++)if(rows[i]&&rows[i].blob)map[hs[i]]=await _blobToDataURL(rows[i].blob);return String(html).replace(/pw-img:([0-9a-z]+)/g,(m,h)=>map[h]||m);}

</script>
<script>
"use strict";
/* ===== backup / import + about-legal (shares globals with the main script) ===== */
function _today(){return new Date().toISOString().slice(0,10);}
function _slug(s){return (s||'project').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'project';}
function _download(data,name){const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
// highlighted text points at its mark by id; imported marks get new ids, so rewrite the page to match
function _remapMarkIds(html,map){return String(html||'').replace(/data-mark="(\d+)"/g,(m,id)=>map[id]!=null?'data-mark="'+map[id]+'"':'');}
function _typesFor(ms){const ids=new Set(ms.map(m=>m.type));return [...HT.values()].filter(t=>ids.has(t.id));}
// imported highlight types / profiles are only ever ADDED (an id that already exists here is left alone)
async function _impHandwriting(data){if(!Array.isArray(data.handwriting))return;for(const r of data.handwriting)if(r&&r.ch&&Array.isArray(r.strokes))await db.hw.add({lang:r.lang||'en',ch:String(r.ch).slice(0,4),strokes:r.strokes,frame:r.frame||null,src:r.src||'import',created:r.created||Date.now()});if(typeof HWS!=='undefined')HWS.dict=null;}
async function _impTypes(data){for(const t of (data.htypes||[]))if(t&&t.id&&!HT.has(t.id)){HT.set(t.id,t);await db.htypes.put(t);}for(const p of (data.profiles||[]))if(p&&p.id&&!PROFILES.some(x=>x.id===p.id)){PROFILES.push(p);await db.profiles.put(p);}if(typeof typesChanged==='function')typesChanged();}
function _mexp(m){return{oid:m.id,type:m.type,fields:m.fields||{},name:m.name||'',tags:m.tags||[],created:m.created,done:!!m.done,doneAt:m.doneAt||null,links:m.links||[],anchor:m.anchor||{kind:'time',yn:0},snippet:m.snippet||''};}
function _sexp(s){return{t:s.t,tool:s.tool,color:s.color,pts:s.pts,minYn:s.minYn,maxYn:s.maxYn};}
async function backupProject(){
  await savePageNow();
  const pg=(await db.pages.get(pid))||{};
  const data={app:'patchwork',type:'patchwork-backup',version:1,scope:'project',exportedAt:new Date().toISOString(),
    project:{name:projName(pid)},page:{html:await inlineImagesForExport(pg.html||''),scrollYn:pg.scrollYn||0,gutterW:pg.gutterW||0},
    marks:marks.filter(m=>m.pid===pid).map(_mexp),htypes:_typesFor(marks.filter(m=>m.pid===pid)),strokes:(await db.strokes.where('pid').equals(pid).toArray()).filter(s=>!s.del).map(_sexp)};
  _download(data,'patchwork-'+_slug(projName(pid))+'-'+_today()+'.json');
  toast('Backed up this project: \u201c'+projName(pid)+'\u201d','ok');db.info.update('info',{lastBackupAt:Date.now()}).catch(()=>{});
}
async function backupAll(){
  await savePageNow();
  const pgs=await db.pages.toArray();const allS=(await db.strokes.toArray()).filter(s=>!s.del);
  const data={app:'patchwork',type:'patchwork-backup',version:1,scope:'all',exportedAt:new Date().toISOString(),
    projects:projects.map(p=>({oid:p.id,name:p.name,created:p.created})),
    pages:await Promise.all(pgs.map(async pg=>({poid:pg.pid,html:await inlineImagesForExport(pg.html||''),scrollYn:pg.scrollYn||0,gutterW:pg.gutterW||0}))),
    marks:marks.map(m=>{const oo=_mexp(m);oo.poid=m.pid;return oo;}),
    strokes:allS.map(s=>{const oo=_sexp(s);oo.poid=s.pid;return oo;}),
    colors:{favorites:COLOR_FAVORITES,recents:COLOR_RECENTS},htypes:[...HT.values()],profiles:PROFILES,handwriting:(await db.hw.toArray()).map(({id,...r})=>r)};
  _download(data,'patchwork-all-'+_today()+'.json');
  toast('Backed up everything ('+projects.length+' project'+(projects.length!==1?'s':'')+')','ok');db.info.update('info',{lastBackupAt:Date.now()}).catch(()=>{});
}
function _sani(h){try{return DOMPurify.sanitize(String(h||''));}catch(e){return '';}}
async function importFile(file){
  let data;try{data=JSON.parse(await file.text());}catch(e){toast('Not a valid backup file','err');return;}
  if(!data||data.type!=='patchwork-backup'){toast('That\u2019s not a Patchwork backup','err');return;}
  try{
    await _impTypes(data);await _impHandwriting(data);
    let goTo=null,summary='';
    if(data.scope==='all'){goTo=await _impAll(data);summary=(data.projects?data.projects.length:0)+' projects';}
    else{goTo=await _impProject(data);summary='project \u201c'+((data.project&&data.project.name)||'Imported')+'\u201d';}
    projects=await db.projects.toArray();marks=await db.marks.toArray();
    lastActivityT=marks.reduce((a,m)=>Math.max(a,m.created||0),0);
    if(goTo)await switchProject(goTo);
    renderProjects();updateBackupLabels();
    toast('Imported '+summary,'ok');
  }catch(e){console.error(e);toast('Import failed: '+(e.message||'error'),'err');}
}
async function _impProject(data){
  const np=await db.projects.add({name:((data.project&&data.project.name)||'Imported').slice(0,60),created:Date.now()});
  const map={};
  for(const m of (data.marks||[])){const nid=await db.marks.add({pid:np,type:m.type||'note',name:m.name||'',tags:m.tags||[],created:m.created||Date.now(),done:!!m.done,doneAt:m.doneAt||null,links:[],anchor:m.anchor||{kind:'time',yn:0},snippet:m.snippet||'',fields:m.fields||{}});map[m.oid]=nid;}
  for(const m of (data.marks||[]))if(m.links&&m.links.length&&map[m.oid]){const mm=m.links.map(x=>map[x]).filter(Boolean);if(mm.length)await db.marks.update(map[m.oid],{links:mm});}
  if(data.page){const h=_remapMarkIds(_sani(data.page.html),map);if(h.length<=MAX_CARD_FIELD)await db.pages.put({pid:np,html:h,scrollYn:data.page.scrollYn||0,gutterW:data.page.gutterW||0});}
  for(const s of (data.strokes||[]))await db.strokes.add({pid:np,t:s.t,tool:s.tool,color:s.color,pts:s.pts,minYn:s.minYn,maxYn:s.maxYn});
  return np;
}
async function _impAll(data){
  const pmap={};
  for(const p of (data.projects||[])){const nid=await db.projects.add({name:(p.name||'Imported').slice(0,60),created:p.created||Date.now()});pmap[p.oid]=nid;}
  const map={};
  for(const m of (data.marks||[])){const np=pmap[m.poid];if(np==null)continue;const nid=await db.marks.add({pid:np,type:m.type||'note',name:m.name||'',tags:m.tags||[],created:m.created||Date.now(),done:!!m.done,doneAt:m.doneAt||null,links:[],anchor:m.anchor||{kind:'time',yn:0},snippet:m.snippet||'',fields:m.fields||{}});map[m.oid]=nid;}
  for(const m of (data.marks||[]))if(m.links&&m.links.length&&map[m.oid]){const mm=m.links.map(x=>map[x]).filter(Boolean);if(mm.length)await db.marks.update(map[m.oid],{links:mm});}
  for(const pg of (data.pages||[]))if(pmap[pg.poid]!=null){const h=_remapMarkIds(_sani(pg.html),map);if(h.length<=MAX_CARD_FIELD)await db.pages.put({pid:pmap[pg.poid],html:h,scrollYn:pg.scrollYn||0,gutterW:pg.gutterW||0});}
  for(const s of (data.strokes||[])){const np=pmap[s.poid];if(np!=null)await db.strokes.add({pid:np,t:s.t,tool:s.tool,color:s.color,pts:s.pts,minYn:s.minYn,maxYn:s.maxYn});}
  if(data.colors){if(Array.isArray(data.colors.favorites))COLOR_FAVORITES=Array.from(new Set([...COLOR_FAVORITES,...data.colors.favorites])).slice(0,18);if(Array.isArray(data.colors.recents))COLOR_RECENTS=(data.colors.recents||COLOR_RECENTS).slice(0,8);DB_saveColors();}
  return Object.values(pmap)[0];
}
function updateBackupLabels(){const a=document.getElementById('bk-proj');if(a)a.textContent='\u2913 this project ('+projName(pid)+')';const e=document.getElementById('bk-all');if(e)e.textContent='\u2913 everything ('+projects.length+' project'+(projects.length!==1?'s':'')+')';}
document.getElementById('proj-btn').addEventListener('click',()=>setTimeout(updateBackupLabels,0));

/* About & legal */
let aboutPanel=null;
const ABOUT={
 about:'<p><b>Patchwork</b> is a local-first page you write <i>and</i> draw on, with a timestamp ledger in the margin. Rich text, free-hand ink, tasks, questions, answers and projects \u2014 all in one file that runs entirely in your browser.</p><p>It is a single static HTML page: no build step, no backend, no sign-up.</p><p class="ab-mut">Version: beta</p>',
 privacy:'<p><b>Everything stays on your device.</b> Your text, drawings, images, the page\u2019s history, timestamps, tags, highlight types and profiles, handwriting examples, projects and colour favourites are stored locally in your browser (IndexedDB). Nothing is uploaded \u2014 handwriting recognition runs entirely on this device.</p><p>There are no accounts, no servers, no analytics and no tracking. The only network requests are loading two open-source libraries (DOMPurify and Dexie) when the page first opens.</p><p>Because your data lives only in this browser profile, clearing site or browser data will erase it. Use <b>Backup</b> regularly and keep your exported <code>.json</code> files safe \u2014 treat them like any personal document.</p>',
 terms:'<p>Patchwork is provided free, <b>as-is and as-available, without warranty of any kind.</b> It is beta software \u2014 features may change and data loss is possible; you are responsible for keeping your own backups.</p><p>You retain all rights to the content you create. To the maximum extent permitted by law, the authors are not liable for any loss or damage (including lost data) arising from use of this app. By using Patchwork you accept these terms.</p>',
 keys:'<p>Tools (when not typing): <b>T</b> text, <b>P</b> pen, <b>H</b> highlighter, <b>E</b> eraser, <b>V</b> scroll.</p><p><b>Ctrl/\u2318 + Z</b> undo, <b>Ctrl/\u2318 + Shift + Z</b> redo \u2014 ink while a draw tool is active, otherwise text.</p><p><b>Ctrl/\u2318 + F</b> find &amp; filter \u00b7 <b>Ctrl/\u2318 + Shift + F</b> explore highlights \u00b7 <b>Ctrl/\u2318 + Shift + H</b> timeline (<b>\u2190 \u2192</b> step through changes) \u00b7 <b>Esc</b> closes panels.</p><p>Select text to highlight it; the <b>+</b> on the selection bar makes a new highlight type in the Highlight Factory. Drag the left margin edge to resize it; the <b>+</b> above the margin adds a timestamp.</p><p>Handwriting: pick the pen, then <b>\u270d Lab</b> teaches Patchwork your writing. Select handwriting with the arrow tool and press <b>\u2728 Aa</b> to read it as text \u2014 the ink is always kept.</p>'
};
function ensureAbout(){if(aboutPanel)return aboutPanel;aboutPanel=document.createElement('div');aboutPanel.className='panel';aboutPanel.style.width='420px';aboutPanel.style.display='none';
  aboutPanel.innerHTML='<div class="panel-h"><div class="panel-ic"><svg width="15" height="15" viewBox="0 0 24 24" stroke="#818cf8" stroke-width="2" fill="none" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.5" r=".7"/></svg></div><div class="panel-t">About &amp; legal</div><button class="panel-x">\u00d7</button></div><div class="panel-b"><div class="seg" id="ab-tabs"></div><div id="ab-body" style="font-size:12.5px;line-height:1.65;color:#c4c4dc;"></div></div>';
  document.body.appendChild(aboutPanel);
  aboutPanel.querySelector('.panel-x').onclick=()=>aboutPanel.style.display='none';
  const tabs=aboutPanel.querySelector('#ab-tabs');
  [['about','About'],['privacy','Privacy'],['terms','Terms'],['keys','Keys']].forEach(([k,lb])=>{const b=document.createElement('button');b.textContent=lb;b.dataset.k=k;b.onclick=()=>showAbout(k);tabs.appendChild(b);});
  makeDraggable(aboutPanel,aboutPanel.querySelector('.panel-h'));
  const st=document.createElement('style');st.textContent='#ab-body p{margin:0 0 9px;}#ab-body .ab-mut{color:#7a7a92;font-size:11px;}#ab-body code{background:#0f0f18;border:1px solid #26263a;border-radius:4px;padding:0 4px;font-size:11px;}';document.head.appendChild(st);
  return aboutPanel;}
function showAbout(k){ensureAbout();aboutPanel.querySelectorAll('#ab-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));aboutPanel.querySelector('#ab-body').innerHTML=ABOUT[k]||'';}
function openAbout(){ensureAbout();showAbout('about');aboutPanel.style.display='flex';aboutPanel.style.left=Math.max(8,(window.innerWidth-420)/2)+'px';aboutPanel.style.top='12vh';aboutPanel.style.right='auto';}
document.getElementById('about-btn').addEventListener('click',openAbout);
addEventListener('keydown',e=>{if(e.key==='Escape'&&aboutPanel&&aboutPanel.style.display!=='none')aboutPanel.style.display='none';});
document.querySelectorAll('button[title]').forEach(b=>{if(!b.getAttribute('aria-label'))b.setAttribute('aria-label',b.title);});
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
