<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Patchwork &mdash; an endless page you write and draw on, time-stamped</title>
<meta name="description" content="One endless surface. Rich text plus free-hand ink, all over the same page, with a margin that stamps when you worked. Nothing leaves your browser."/>
<meta name="theme-color" content="#0d0d14"/>
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><rect x="1.5" y="1.5" width="21" height="21" rx="5" fill="%2310131f" stroke="%235a4a2b" stroke-width="1"/><path d="M6 4v16" stroke="%235a4a2b" stroke-width="1.2"/><path d="M9 7c3-2 6 4 9 1" stroke="%23f59e0b" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="6" cy="8" r="1" fill="%23fbbf24"/><circle cx="6" cy="15" r="1" fill="%23fbbf24"/></svg>'/>
<script src="js/vendor/purify.min.js"></script>
<script src="js/vendor/dexie.min.js"></script>
<link rel="stylesheet" href="css/patchwork.css"/>
</head>
<body>
<div id="bar1">
  <div id="brand"><div class="mark"><svg width="15" height="15" viewBox="0 0 24 24"><path d="M6 3v18" stroke="#5a4a2b" stroke-width="1.4"/><path d="M9 8c3-2 6 4 9 1" stroke="#f59e0b" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M9 15c3-2 6 4 9 1" stroke="#fbbf24" stroke-width="2" fill="none" stroke-linecap="round" opacity=".6"/></svg></div><div class="name">patch<b>work</b></div></div>
  <button id="proj-btn" class="mbtn" style="width:auto;min-width:32px;padding:0 9px;gap:6px;font-size:12px;color:#c8c8dc;" title="Projects"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg><span id="proj-name">Main</span></button>
  <div class="bsep"></div>
  <button class="mbtn on" id="m-text" data-mode="text" title="Write / format (T)"><svg width="15" height="15" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"><path d="M5 6h14M12 6v13"/></svg></button>
  <button class="mbtn" id="m-pen" data-mode="pen" title="Pen (P)"><svg width="15" height="15" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
  <button class="mbtn" id="m-hl" data-mode="hl" title="Highlighter (H)"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l6 6"/><path d="M13.5 6.5l4 4-7.5 7.5H6v-4z"/><path d="M4 21h16" stroke-width="2.4"/></svg></button>
  <button class="mbtn" id="m-eraser" data-mode="eraser" title="Erase ink (E)"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8.5L3.4 14.9a1.9 1.9 0 0 1 0-2.7l7.6-7.6a1.9 1.9 0 0 1 2.7 0l5.9 5.9a1.9 1.9 0 0 1 0 2.7L13 20"/><path d="M8.5 9.5l6 6"/></svg></button>
  <button class="mbtn" id="m-hand" data-mode="hand" title="Scroll (V)"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a1.5 1.5 0 0 0-3 0M15 6V4.5a1.5 1.5 0 0 0-3 0V6M12 6V5a1.5 1.5 0 0 0-3 0v7"/><path d="M9 12V8.5a1.5 1.5 0 0 0-3 0V14c0 3.3 2.4 6 6 6s6-2.4 6-6v-3"/></svg></button>
  <div class="bsep"></div>
  <button class="mbtn" id="undo" title="Undo (Ctrl+Z)"><svg width="15" height="15" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3.5 13a9 9 0 1 0 2.6-7.6L3 8"/></svg></button>
  <button class="mbtn" id="redo" title="Redo (Ctrl+Shift+Z)"><svg width="15" height="15" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 7v6h-6"/><path d="M20.5 13a9 9 0 1 1-2.6-7.6L21 8"/></svg></button>
  <button class="mbtn" id="clearink" title="Clear all ink"><svg width="15" height="15" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
  <div class="bsep"></div>
  <button class="mbtn" id="factory-btn" title="Highlight Factory — make your own highlight types"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M5 20V10l4 3V10l4 3V6h3l1 14"/><circle cx="17.5" cy="3.5" r="1" fill="currentColor"/></svg></button>
  <button class="mbtn" id="explore-btn" title="Explore highlights (Ctrl+Shift+F)"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/><path d="M8 9h5M8 12h3"/></svg></button>
  <button class="mbtn" id="timeline-btn" title="Timeline — travel back through this page (Ctrl+Shift+H)"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/></svg></button>
  <button class="mbtn" id="about-btn" title="About & legal"><svg width="15" height="15" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.5" r=".7"/></svg></button>
  <div id="spacer-r"></div>
  <button id="now" title="Jump to the latest"><svg width="13" height="13" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>now</button>
</div>
<div id="bar2">
  <div class="toolbar" id="note-tb"></div>
  <div id="inkbar">
    <button id="ink-color" class="ink-color-btn" title="Pen colour"><span class="icb-sw"></span><span class="icb-cv">▾</span></button>
    <button id="ink-grab" class="ink-tool-btn" title="Select & move strokes (Del to delete)"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18l5-5 3 7 3-1.3-3-6.7h7z"/></svg></button>
    <div class="bsep"></div>
    <div id="sizewrap"><input type="range" id="size" min="1" max="48" value="3"/><span id="sizeval">3 px</span></div>
    <div class="bsep"></div>
    <button id="ink-recognize" class="ink-tool-btn hw-inkbtn" title="Recognise the selected handwriting as text (the ink is kept)">✨ <span>Aa</span></button>
    <button id="hw-lab-btn" class="ink-tool-btn hw-inkbtn" title="Handwriting Lab — teach Patchwork your handwriting">✍ <span>Lab</span></button>
  </div>
  <span id="handmsg">Scroll the page &mdash; one finger / wheel. Pick a tool to write or draw.</span>
</div>

<aside id="side"><div class="side-top"><span class="side-title">Find &amp; filter</span><button class="fx-link" id="side-explore" style="margin-left:auto;margin-right:8px" title="Search every highlight, card field and tag">Explore all →</button><button class="panel-x" id="side-x" title="Close">×</button></div><div class="side-search"><svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="side-q" placeholder="Search all projects…" autocomplete="off"/></div><div id="side-results"></div><div class="side-sech">Types — click to show / hide, hover for items</div><div id="filterbar"></div></aside><div id="side-scrim"></div>
<div id="stage">
  <div id="wrap"><div id="pad">
    <div id="note-valign" class="editor-valign-wrap valign-top">
      <div id="note-ed" class="editor" contenteditable="true" spellcheck="true"></div>
    </div>
  </div></div>
  <canvas id="ink"></canvas>
  <div id="gut"><div id="gut-tools"><button id="gut-add" title="Add a timestamp here">+</button><button id="gut-find" title="Search & filters"><svg width="15" height="15" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button></div><div id="gut-grip" title="Drag to resize the margin"></div></div>
  <div id="hint">write with <b>T</b>, draw with the <b>pen</b> \u2014 same page.<br>the margin <b>stamps the time</b> as you work.</div>
</div>

<div id="toast"></div>
<span id="note-status" style="display:none"></span>

<script src="js/editor.js"></script>
<script src="js/app.js"></script>
<script src="js/images.js"></script>
<script src="js/highlights.js"></script>
<script src="js/explorer.js"></script>
<script src="js/timeline.js"></script>
<script src="js/handwriting-core.js"></script>
<script src="js/handwriting.js"></script>
<script src="js/backup.js"></script>
<script src="js/about.js"></script>
</body>
</html>
